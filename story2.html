    <style>
        /* ===== PREMIUM DARK MODE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e9ef, #ffffff);
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -2px -2px 8px rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
            box-shadow: 6px 6px 15px rgba(0,0,0,0.15), -3px -3px 10px rgba(255,255,255,0.9);
        }
        .theme-toggle:active { transform: scale(0.92); }

        /* ----- Transition for all elements ----- */
        body, body *, body *::before, body *::after {
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }

        /* ----- DARK MODE body ----- */
        body.dark-mode {
            background-color: #0f0f1a;
            color: #d4d4e0;
        }

        /* Toggle button in dark */
        body.dark-mode .theme-toggle {
            background: linear-gradient(145deg, #1e1e30, #2a2a44);

        /* ----- Story pages ----- */
        body.dark-mode .story-container {

        }

        body.dark-mode h1 {

            -webkit-text-fill-color: transparent !important;
        }

        body.dark-mode h2 {
            color: #a78bfa;
            border-bottom: 2px solid rgba(167, 139, 250, 0.2);
        }

        body.dark-mode h3 { color: #c4b5fd; }

        body.dark-mode .stats,

            background: rgba(30, 30, 50, 0.8);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        body.dark-mode .check-item {
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            border-radius: 6px;
        }

        body.dark-mode .check-used {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: none;
        }

        body.dark-mode .vocab-word {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(129, 140, 248, 0.35);
            box-shadow: none;
            text-shadow: none;
        }
        body.dark-mode .vocab-word:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #c7d2fe;
            border-bottom-color: rgba(165, 180, 252, 0.5);
            box-shadow: none;
            transform: none;
        }

        body.dark-mode a.back-btn {
            color: #818cf8;
        }
        body.dark-mode a.back-btn:hover { color: #a5b4fc; }

        body.dark-mode button {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        body.dark-mode button:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }
        body.dark-mode button.active {

        body.dark-mode #meaning-display {

    </style>

    <style>
        /* ===== TRANSLATE POPUP ===== */
        .translate-popup {
            position: absolute;
            display: none;
            z-index: 1002;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }
        .translate-popup:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .translate-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #6366f1;
        }
        body.dark-mode .translate-popup {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        }
        body.dark-mode .translate-popup:hover {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        body.dark-mode .translate-popup::after {
            border-top-color: #8b5cf6;
        }

    
        /* Extra styles for meaning popup */

        .m-example {
            font-size: 0.95em;

            font-style: italic;
            border-left: 3px solid #fdcb6e;
            padding-left: 10px;
            margin-top: 5px;
        }
        .m-loading {
            font-size: 0.9em;
            color: #aaa;
            font-style: italic;
        }

</style>

        const baseStories = ["Arthur was an ambitious guy in his youth. His occupation was a scholar of biology, but his true desire was to build a startup. His mission was to create an app that would map a remote land. He was eager to proceed, and he did possess a definite plan to ensure success. However, the business landscape was rough. It felt like a constant battle against an incredible monster, or an enemy tribe from an ancient legend. He did intend to secure a victory, nevertheless.\n\nHis household did consist of just him and his lovely bride, who offered him pure support. She sold her jewelry to pay the initial fee for the business permit. \"We must seek out investors,\" she would softly remark. Arthur felt anxious; a previous venture had been an awful disaster, bringing an explosion of debt that left his bank account pale and a heavy load on his chest. It had been a significant threat to his confidence, like a volcano erupting and causing a thick cloud of terror. The consequence was severe, threatening to sink his dreams, and his hopes sank. He refused to be a victim again.\n\nTo build his company on a factual basis, Arthur needed a senior colleague and a capable chief of operations. He hired his relative, who was confident and broad in his knowledge. They would debate strategy. The startup required considerable effort. Their office was a narrow space, hardly a palace or a castle. It felt like a cage at times, making Arthur want to scream. They had to surround themselves with positive energy. The northern border of the room had a window where steam would fog up in the winter, and the southern side had a small sculpture and a statue of a brave warrior near the entrance.\n\nArthur wanted to command his team with military precision. He would concentrate and lift his heavy boot, walking rapidly at a steady pace. He would take a deep breath in his lung, a calm motion, trying to suppress his anger when things went wrong. He knew competitors might try to cheat or steal their sensitive code. \"We must convey trust,\" Arthur would counsel his team. \"Unless we obey our own strict rules, we will disappoint everyone.\" They were on a marathon, not a sprint. The upper management had to submit to a grueling schedule.\n\nArthur felt the pressure. It was like he was lost overseas or abroad, searching for ancient ruins or a hidden temple. He imagined holding a bow and an arrow as a weapon. He would not let anyone disturb his intent focus, twist his words, or spill his coffee. Sometimes, the stress would depress him. The mood would darken. He would stare at a bush or a weed shaking in the shade outside. The silent room lacked laughter. \"We must not let our efforts be in vain,\" he told them. \"A wise ancestor would tell us to wrap up our fears and fight without protest.\"\n\nHe had an idea to supplement their income by offering an exchange of services. He tried to persuade investors to grant them a favor and take a dive into their financial log. He wanted to impress them, so he put on a polite smile, making sure to frame his pitch at the right angle. He knew he had to be superior to the competition. During a pitch, Arthur showed a brief presentation to satisfy their demands. The financial estimate looked good. He answered their questions, showing how their app could track a meteor or map a new route. He showed he could bring light and shine on complex data.\n\nHe began to fascinate the investors. One investor decided to give them a chance. They stood to congratulate Arthur and offer high praise. It felt like heaven. He had won the chase for funding. He maintained his honor. Now, they had the capital to build a new wing of their office. They could finally depart from their cramped space. They had built a colony of loyal users. \"I conclude that this is a success,\" he said. The work would last forever, but it was no longer a disadvantage. It was a definite win.\n", "The family dinner was meant to be a delight, our destination a cozy house in the valley. \"I ought to remind you to check the weather forecast next time,\" Dad muttered. \"It's not my fault,\" Mom replied with a gentle smile. \"I'm just a secretary, not a genius in astronomy or geography. We have plenty of time to chat.\"\n\nWe had to navigate a wet path along the edge of a cliff to get there. A thick fog cast a shadow over the peak, creating an extraordinary and slightly severe vision. I began to suspect the bad weather might dictate a change of plans, or at least interfere with our attempt to arrive on time. Despite the intense rain and the mud on the road, our crew managed to succeed in reaching the old place, a former royal resort that Uncle Arthur had managed to convert into a family home. We couldn't ignore the obvious: the foundation was old, the soil around it was soft, and the house had required a double layer of metal to defend against structural destruction. Yet, it was unique, and Arthur felt immense pride in it.\n\nInside, Uncle Arthur, the principal authority of our generation, stood by the door. He was a giant of a man in a crisp uniform, a former army officer who used to govern troops. Now, he was a generous boss who would donate a billion dollars to charity if he had the fortune, though his actual income was more modest. We were a mad but loving bunch, and it was apparent he was thrilled to see us. \"Welcome!\" he would always declare with a gentle voice that seemed to absorb the anxiety of the violent storm outside. We didn't resist his warm embrace.\n\nThe kitchen was an enormous mess, in a state of utter disorder. Aunt Martha was there, trying to bake a pie. She was no genius in chemistry, but her talent for cooking was undeniable. She had every ingredient laid out in a long row on the shelf. To elevate the flavor, she would consult an old recipe book, trying to calculate the exact quantity needed. \"I insist you all sit down and relax,\" she said, refusing any aid. \"I can handle this.\"\n\n\"You ought to let us help,\" my sister chimed in. She was a secretary for a city council, used to helping every citizen she met. But Martha remained passive, choosing to struggle alone rather than cooperate. She playfully threatened to sue anyone who dared step into her workspace, so we stepped back to avoid any division or blame.\n\nWe gathered in the living room, lit by a single candle. My cousin Leo, who lived in a college dormitory while writing his thesis on physics and astronomy, began to chat about a dinosaur exhibit he had seen. He had used money from his student fund to buy a super new gadget to monitor his health during the trip. He made an admission that he bought it out of pure spite, just because his roommate had one. He promised not to abuse the device, though the long walks would definitely exhaust him. His brother, a landscape tutor studying geography and working in a greenhouse for a local environmental committee, began to carve a tiny wooden bird, letting the wood shavings spin to the floor.\n\n\"Did you hear the tale of the old sword found near the capital?\" Leo asked, eager to reveal some history. \"It belonged to a slave who led a rebellion. They had to commit to a severe trial and face an emergency just to get rid of their oppressors and relieve their debt.\" \n\nUncle Arthur listened, trying to compose his thoughts. \"History is full of such proof of courage,\" he said. \"It should remind us not to take our freedom lightly. The potential for greatness is in everyone, even the seemingly stupid or blind.\"\n\nDinner was finally served. We were eager to dine, ready to devote our attention to the food. There was plenty for everyone: roasted meat, a massive portion of bean salad, and a smooth gravy that was sure to decrease any remaining hunger. It was so good it felt like a trap to make us eat too much.\n\nAs we ate, we couldn't help but admire the reputation Martha had built as a cook. No one could oppose the fact that her meals were the stuff of fame. We felt a guarantee of happiness, knowing we could afford to be together, sharing stories without fear of an argument that might frustrate the evening.\n\nEven though it was just an initial gathering, the impression was lasting. We didn't need to dig deep to find joy. A family dinner isn't a funeral; it's a celebration. We would not quit this tradition. And so, we made a contract to lend each other our time, to enable more nights like this, and to never let our bond face a decrease in strength. We were a family, ready for any hike up life's mountains, standing together, come what may.\n", "Our backpacking adventure started with a bold aim. We wanted to accomplish a trek beyond the usual agriculture fields, into the remote mountains. My friend, a junior journalist by profession, carried a diary to document every element of our trip. We didn't want to delay our departure, thus we woke up fully awake at the crack of dawn. Our last task was to attach the baggage label to our packs. I relied on my ability to pack well, making sure to insert raw grain, a small telescope, and enough tissue.\n\n\"I bet we'll detect some odd animals,\" my friend would exclaim with excitement. \"I'll illustrate them in my book!\" I tried to convince him to be rational and not pretend we were some astronaut exploring a new satellite with zero gravity.\n\nWe started our commute by taking an old carriage to the base of the trail. The driver, an immigrant who used to be a mechanic in a garage, stopped to greet us. He had a sincere tone and a kindly gesture. His architecture of words was classic. He warned us not to slip on the dust and gravel. \"Do not let a sudden shock interrupt your focus,\" he advised.\n\nTo save expense, we decided to rent a spot in a farmer's yard for the first night. He was a man who decided to retire early to escape the poverty of the city. Moreover, he didn't want to participate in the labor of a factory shift anymore. He had a pup of a rare breed that was in a stable tied to a chain. The dog was shy at first but showed joy when I began to pour water into its bucket. The farmer\u2019s presence was calming, and he explained his origin and his motive for moving here. The reception we got was warm. We hoped he would grant us permission to extend our stay, which he did readily. \n\nThe next morning, the fever of the adventure caught us, though my friend felt a slight flu coming on. We didn't want to freeze, so we wore a heavy costume of jackets. \"I deny that I am sick,\" he said, trying to emphasize his courage. We had to pause to let him recover, and we didn't reject the idea of a gradual climb. Our duty was to investigate the underground miner trails. We passed an elementary barrier of rocks and saw a stream that seemed to float down the mountain. The height of the peaks was staggering.\n\nWe met a monk and a priest on a pilgrimage. They alike wore formal robes. I tried to interpret their faith, and they didn't criticize our curious questions. They offered us a raw mineral that looked like a jewel as an award for our respect. They explained its likeness to a healing stone that could heal wounds. The encounter was distinct, and I couldn't distinguish if it was real or an artificial cartoon. We had to invent a way to carry it safely in our packs.\n\nWe had to resume our hike, making sure to skip the dangerous parts. My friend started to stare at a nest high up. He had to stretch to see it. It was an instant of wonder. But then an alarm sounded from a nearby camp. A signal was sent out. We learned later someone tried to rob a hiker, but an officer of high rank managed to arrest the convict. We were relieved that the authorities would not approve of such behavior and took action. \n\nThat night we found a cave that looked like a large chamber with a high ceiling. We didn't want to annoy any bats. It was somewhat cold, but the silence was golden. We had to refrigerate our food in the cold water. We talked about how our views differ and shared our perspective. We asked to confirm the approximate statistic of hikers who qualify for the prime contest of summiting. \n\nIt was an incredible journey. No failure, just pure adventure. I beg you to adopt the backpacking life. I wouldn't forbid anyone from trying. It's the origin of true self-recognition. It was a repair for the soul. We were apart from the world, in a scale so grand. We were no fool. Indeed, it was a masterpiece.\n", "In the year 2142, humanity had managed to overcome a severe shortage of essential resources. I recall the days when the mere thought of a green earth was abstract fiction. My elder twin brother and I would often inspect our dusty journal, recounting tales of when the world was a dull place. Now, thanks to the grand artificial intelligence system known as The Cardinal, things had changed.\n\nNowadays, we no longer need to borrow cash for an ordinary meal. The Cardinal's formula allowed us to obtain sufficient nutrient liquid from a small tube. It wasn\u2019t a solid substance, so there was no need to chew, but it was practical. Our temporary housing was a neat cabin with a sturdy roof, capable of withstanding a fierce hurricane or flood.\n\nOn one occasion, we decided to engage in a task downtown. We had to hire a virtual vehicle to take us across the electronic bridge. The fare was deducted automatically; no wallet or physical loan was required. The city was a marvel of architecture. We would often gaze at the permanent structures that somehow manage to resemble ancient coral reef and shell formations along the shore. \n\nThe primary task for the day was to visit a firm where my brother had just found a new job. His starting salary was impressive. However, getting there was tough. A sudden crash in the network caused our vehicle to shut down. We had to settle for walking. We didn't dare complain, as the penalty for a rude yell could result in being sent to a rehabilitation zone.\n\nAlong the plain path, we saw a bare branch of a tree. It was a synthetic seed experiment intended to preserve the environment. We took a deep breath. Despite the synthetic cloth and cotton we wore, we felt a sort of romantic connection to the earth. \n\nAs we walked, we encountered a disabled man sitting on a clay pot. He asked for an apology for being in our way. We assured him he was innocent of any offense. The man began pronouncing strange words, like a witch from old religious tales. He claimed he could subtract the sorrow from any soul. It was enough to amuse us, but we knew we shouldn't accuse him of being a criminal or assume he belonged in jail.\n\n\"I am a former minister,\" he said in a sharp whisper, trying to cast a net of mystery over us. \"I used to invest in the philosophy of the human mind.\"\n\nHe pulled out a dozen small items\u2014a feather, some tobacco, a piece of coral. \"I am trying to found a new belief system,\" he continued, holding up a small bowl. \"This is a treasure I managed to capture.\"\n\nIt was a small, fertile plant. A real one. \"I didn't steal it,\" he added quickly, to expose his good intentions. \"I don't deserve the grave.\"\n\nWe didn't embarrass him. We simply admired his bold spirit. He didn't seem guilty of anything but holding onto the past.\n\nWe finally arrived at the firm. The deck was made of solid steel, and there was a tight fence around it. We had to adjust our facial scanners to gain entry. Inside, the furniture was minimalist, covered by a curtain that simulated a natural breeze. \n\nMy brother's client was a man named Duke. He had a strict manner but was fair. He explained that their annual goal was to mount a new expedition to the virtual stars. They were trying to manufacture a new type of fuel, and plant our flag on a new planet. I have to admit, his vision did inspire me. Any loss in production would mean a severe setback.\n\n\"We must maintain a firm grip on our stock,\" Duke said. \"There is no room for regret.\"\n\nMy brother was tasked with overseeing the surgery bay, where workers underwent cybernetic enhancements. They would bathe in a special liquid bath to heal any wound.\n\nI decided to accompany him to his quarter. We had to bend around several corridors. It felt like walking through an ancient tomb. But inside his workspace, it was fantastic. There was a large wheel that generated power. A small bin held discarded synthetic tissue.\n\n\"I urge you to be careful,\" I told him. \"I don't want you to experience any negative symptom.\"\n\nHe nodded. \"I know. The work here is ideal, but it requires constant vigilance. I must be worthy of my scholarship.\"\n\nAs I left, I couldn't help but appeal to the universe that we would inherit a better world. We were no longer tied to the land like farmers at a rural inn. We were explorers in a new era, learning to surf the waves of innovation. I just hoped our efforts would yield a bountiful harvest. We had to weigh our options carefully, ensuring we never became slaves to our own creations. And with that thought, I returned home.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>

    <script>
        const posMap = {
            'noun': 'Danh từ',
            'verb': 'Động từ',
            'adjective': 'Tính từ',
            'adverb': 'Trạng từ',
            'pronoun': 'Đại từ',
            'preposition': 'Giới từ',
            'conjunction': 'Liên từ',
            'interjection': 'Thán từ'
        };

        async function fetchExample(word) {
            try {
                const response = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
                if (!response.ok) return null;
                const data = await response.json();
                
                // Find first example
                for (let meaning of data[0].meanings) {
                    for (let def of meaning.definitions) {
                        if (def.example) {
                            return {
                                partOfSpeech: meaning.partOfSpeech,
                                example: def.example
                            };
                        }
                    }
                }
                
                // If no example but has POS
                if (data[0].meanings.length > 0) {
                    return {
                        partOfSpeech: data[0].meanings[0].partOfSpeech,
                        example: null
                    };
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // We replace the old logic that sets text directly
        document.addEventListener('click', async function(e) {
            if (e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const data = allVocab[word];
                
                if (data) {
                    const display = document.getElementById('meaning-display');
                    
                    // Mark as checked
                    const checks = document.querySelectorAll('.check-item');
                    checks.forEach(c => {
                        if (c.textContent.trim().toLowerCase() === word.toLowerCase()) {
                            c.classList.add('check-used');
                        }
                    });

                    // Initial popup render with local data
                    display.innerHTML = `
                        <div class="m-header">
                            <span class="m-word-title">${word}</span>
                            <span class="m-type" id="m-pos">...</span>
                        </div>
                        <div class="m-meaning">Nghĩa: ${data.meaning}</div>
                        <div class="m-example" id="m-ex"><span class="m-loading">Đang tìm ví dụ...</span></div>
                    `;
                    display.style.display = 'flex';
                    
                    // Play audio
                    const audio = document.getElementById('audio-player');
                    audio.src = 'media/' + data.audio;
                    audio.play().catch(e => console.log('Audio error:', e));

                    // Fetch example
                    const exData = await fetchExample(word);
                    const posEl = document.getElementById('m-pos');
                    const exEl = document.getElementById('m-ex');
                    
                    if (exData) {
                        const vietnamesePos = posMap[exData.partOfSpeech.toLowerCase()] || exData.partOfSpeech;
                        if (posEl) posEl.textContent = vietnamesePos;
                        
                        if (exEl) {
                            if (exData.example) {
                                exEl.innerHTML = `<strong>Ví dụ:</strong> "${exData.example}"`;
                            } else {
                                exEl.innerHTML = `<span class="m-loading">(Không tìm thấy ví dụ trên từ điển)</span>`;
                            }
                        }
                    } else {
                        if (posEl) posEl.style.display = 'none';
                        if (exEl) exEl.innerHTML = `<span class="m-loading">(Không thể tải dữ liệu từ điển)</span>`;
                    }

                    // Auto hide after 8 seconds
                    if (window.meaningTimeout) clearTimeout(window.meaningTimeout);
                    window.meaningTimeout = setTimeout(() => {
                        display.style.display = 'none';
                    }, 8000);
                }
            }
        });

        // Click outside to hide
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.vocab-word') && !e.target.closest('#meaning-display')) {
                const display = document.getElementById('meaning-display');
                if (display) display.style.display = 'none';
            }
        });
