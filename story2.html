                processedHtml = processedHtml.replace(regex, (match) => {

                });
            });

            processedHtml = processedHtml.split('\n\n').map(p => {
                if(p.startsWith('<h2>')) return p;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        document.getElementById('content1').innerHTML = s1.html;
        document.getElementById('stats1').innerHTML = `Đã sử dụng <strong>${s1.matchedCount} / ${words1.length}</strong> từ vựng.`;
        document.getElementById('content2').innerHTML = s2.html;
        document.getElementById('stats2').innerHTML = `Đã sử dụng <strong>${s2.matchedCount} / ${words2.length}</strong> từ vựng.`;

        function buildChecklist(containerId, wordList) {
            let html = '';
            wordList.forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById(containerId).innerHTML = html;
        }
        buildChecklist('checklist1', words1);
        buildChecklist('checklist2', words2);

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>
</body>
</html>
