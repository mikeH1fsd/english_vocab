        const baseStories = ["At the corporate headquarters of an overweight benefactor known as Mr. Vance, an awkward situation began to arise. The company, which produced elegant fabric and wool garments, was located in a distant province surrounded by wheat fields. In the district office, two employees who had to occupy the same space shared a mutual hatred: an ambitious newcomer named Clara, and a loyal veteran named Tom, who worked with the intensity of a blacksmith underneath a hot iron chimney.\n\nTom, who considered himself a humble shepherd of the company's finances, felt Clara's enthusiastic expedition into new marketing was a disgrace. He felt she treated him like an inferior mayor of a skeleton town. Clara felt Tom was acting like a wicked caretaker of an old cemetery of ideas, letting progress rot and decay in a dark closet.\n\nWhen they would encounter each other in the alley behind the office or bump into each other near the rear exit, the tension was palpable. The complaint soon reached HR. The mediator, Sarah, knew she had to console both and forge a satisfactory resolution before the conflict would spoil the workplace and starve productivity. She did not want to discourage either of their passion for the job.\n\nShe invited them to a lodge that served as a refuge for executive retreats. It wasn't a rustic hut, but a compact cabin near a bay, complete with a couch and a warm fireplace burning coal.\n\n\"We aren't here to chop each other down with an ax,\" Sarah began, her voice a gentle whistle over the drip of the coffee maker. \"I don't want to preach, but we must endure this process and restore peace.\"\n\nClara let out a sneeze into her elbow, rubbing her chin. \"Tom thinks I'm a fake, a pirate trying to acquire his last penny for some fancy valentine promotion. He treats every chore like a curse.\"\n\nTom, adjusting his hood\u2014a ridiculous disguise he wore to keep out the loose winter draft\u2014glared, a curl of gray hair falling over his forehead. \"Your arithmetic is flawed. If we execute your plan, we will abandon our core inhabitant demographics. It's a tremendous riddle to me why you persist. You act like a politician or senator making empty promises.\"\n\n\"I just tease out new trends,\" Clara argued, feeling a sensation of anger stir. \"You just open your desk drawer, tap your pen, and let opportunities eclipse us! Sometimes dealing with your thick skull is like dragging a heavy sled uphill.\"\n\nSarah raised her hands to alert them, hoping to refresh their perspectives. \"Let's not offend each other. We must nourish our teamwork. Tom, you have a scar from a past failed venture\u2014I know you felt ashamed when that industry publication criticized us. You're trying to be charitable and save us from a disgrace. But Clara isn't trying to deceive you.\"\n\nClara shifted her weight. \"I don't want to irritate you, Tom. I want the company to prosper and exceed expectations. I'm not some fairy asking for magic; I just want a decent budget. Even a kid could see this market is ready to bloom.\"\n\nTom looked out the window at a pine tree near the horizon. The sky was dark, and a lone flashlight beam cut through the evening mist. He let out a bark of a laugh, surprisingly full of grace. \"Maybe I've been deaf to your ideas. I guess I need to come to my senses.\"\n\n\"I'm willing to compensate for my offense,\" Clara offered, extending a hand to grasp his. \"I can acquaint you with the new data. I am grateful for your experience, and I promise not to overlook your expertise. We can find a satisfactory ground.\"\n\nSarah smiled, noting their pulse had calmed. \"This is brilliant. Tomorrow, let's put out a bulletin or broadcast our new joint strategy. For tonight, let's enjoy some dessert\u2014maybe a dip in the hot tub, or some leisure time by the fire. No need to scare ourselves overnight.\"\n\nThey shared a bunch of spice cookies and relaxed against a soft pillow. Tom realized he wasn't a veterinarian trying to save a sick worm; he was a partner in a growing enterprise. Clara realized Tom wasn't a curse but a modest carpenter building a ladder to success. They felt a deep satisfaction as they agreed to repay each other's trust. The thrill of collaboration replaced their animosity, and they knew that shortly, on their work anniversary, they would celebrate how they managed to sustain mankind's best trait: cooperation. They would no longer neglect their duties to rub shoulders and find a way forward without letting frustrations burst.\n", "I adjusted the collar of my trim shirt, glancing upwards at the clock. A bead of sweat dripped from my bald head. The absence of a breeze made the waiting room feel like a stove. The receptionist, a cheerful woman eating a nut and some cereal, gave me a casual nod. She seemed to inhabit her own little world, humming a nursery rhyme aloud while trying to reproduce a drawing of a blossom on her notepad.\n\nI was applying to be a chef's apprentice on a luxury vessel, a massive ship that would soon make its departure on a voyage across the ocean to a distant port harbor. The current chef was rumored to be a millionaire who demanded priority over every affair. He had the ego of a pharaoh or an emperor wearing an ivory crown and a fancy robe, demanding his workers kneel at his knee and worship him.\n\nI sat on a steel chair, trying to anticipate the questions. \"Don't panic,\" I told myself, trying to soothe my nerves. My knee was still sore from when I used to wrestle in the highlands, a fatal mistake during a horrible quarrel with a bully of an opponent. That bitter defeat used to sting, a constant torture that made me want to crawl under a blanket and take a nap.\n\nI needed to secure this job. My rival, a dishonest dwarf of a man with an abnormal dialect, was also in pursuit of the position. He liked to boast about his ability to roast a ripe vegetable or toss a swift salad. He tried to imitate my recipes and exploit my ideas, essentially committing theft. We used to be a close ally, sharing a bond over a shared manuscript of a proverb about a wilderness ecosystem, but a dispute over a carbohydrate recipe led to our culinary divorce.\n\nSuddenly, a bell chimed. \"He will see you now,\" the receptionist said, offering a pat on my back. \"I beg your pardon, but exercise caution. He has a slim tolerance for fools.\"\n\nI walked into the office. The chef, an imposing figure, sat behind a desk made of bamboo, tapping his fingers with a deliberate rhythm. He had a dominant presence, like a sheriff ready to enforce the law. An assembly of culinary awards hung on the wall behind him.\n\n\"I see you've brought a kit,\" he noted, his voice smooth.\n\n\"Yes,\" I replied, opening my bag to reveal a polish rag, a needle, some thread, and a sharp knife. \"A diligent worker must always be prepared to sew up a stuffed bird, or carve meat with a precise diameter.\"\n\nHe let out a puff of smoke from a cigar. \"Contrary to what you might think, this isn't a merry routine. It is an urgent march. A single germ can dissolve a reputation. You must have the patience to watch a leaf fall into a pond, but be swift as a bullet when orders come. If a pot is about to explode, you don't creep around. You bounce into action, pull the trigger, scatter the danger, and unify the kitchen.\"\n\n\"I assure you, I have no impatient habits. I can endure any strain,\" I said. \"Even if I ail, my focus will not vanish.\"\n\nHe leaned forward. \"What if the ship springs a leak, and you have to abandon it? Will you save the food or yourself?\"\n\n\"I'd toss a barrel of supplies aboard a wagon if we were on land, but at sea, I'd secure a life raft with a compass and enough fiber-rich rations to survive a famine, ensuring the crew doesn't starve in the middle of nowhere.\"\n\nThe chef raised an eyebrow. \"And if an infant starts to cry, threatening to ruin the atmosphere for our guests?\"\n\n\"I would quickly prepare a mild dish that an n aborigine warrior on the wall. To accommodate his guests, he laid out a supper: a slice of roast, a pile of fruit, and a tender stem of a daisy for decoration, hoping the modest feast might tempt them to yield.\n\nThe dispute seemed to originate over a ban on trade across the river span. A magnificent knight in heavy armor, Sir Vance, represented the crown. Beside him sat a messenger, adjusting a uniform that bore a crimson stripe. Opposite them sat Elara, a pregnant rebel leader wrapped in a cloak colored with a deep blue dye. Her past as an orphan of the last invasion fueled her rage and profound thirst for revenge. She possessed a remarkable aptitude for strategy, a trait that made her a terrifying foe. Beside her was a young adolescent warrior holding a spear and looking as fierce as a bear cub.\n\n\"I presume we can affirm our commitment to peace,\" Kael began, trying to navigate the tension. \"We must not let superstition or petty sorrow hinder this joint commission. I have no affection for war.\"\n\nSir Vance let out a hollow sigh. \"The troops will not withdraw unless the clan will confess to the recent incident at the border ranch. That act of treason cannot be ignored; I will not dismiss it. If you object, the invasion will commence.\"\n\nElara's eyes flashed like lightning. \"Treason? Your king seeks to confine us, to steal our liberty and independence. Our revolution is a direct outcome of his miserable laws! We will not pose as willing subjects.\"\n\n\"We offer you a terrific compromise,\" Kael interjected with emphasis, hoping to tame every flame of conflict before they erupt into a full blaze. \"The crown will spare the remainder of your lands and grant your people full agency, provided you surrender the ringleaders of the plot to face justice.\"\n\nA sudden boom of thunder made the floorboards vibrate, and a loud bang echoed outside as a storm began. Hail pounded the cottage roof. Elara plucked the daisy, feeling the extent of the pressure.\n\n\"A compliment disguised as punishment,\" she sneered, dissatisfied. \"You ask for a sacrifice we cannot make. My people will not retreat or gamble their lives on a fable of mercy. It brings us only shame.\"\n\nKael watched a leak drip from the ceiling. He knew the instinct of a warrior was to strike. He watched his aide retrieve a literary document from his satchel, a treaty penned by a wise physician who championed a supreme form of peace.\n\n\"Look at this headline from the capital's journalism,\" Kael said smoothly. \"The populace demands an end to the horror. They hold immense sympathy for your plight. If we confront the king with a unified demand, he must accommodate it.\"\n\nThe young adolescent warrior bristled. \"We should seize the cliff and push them into the lava of the ancient volcano! Let them burn to ash!\"\n\n\"Quiet,\" Elara commanded. \"We are not beasts to howl in the daytime. We must be cautious.\"\n\n\"If I may inquire,\" Kael said gently, sipping from a straw, \"what will ease your concerns?\"\n\n\"To coincide with the festival, the ban must end,\" Elara said, giving Kael's offer a stroke of consideration. \"And we require a guarantee. No jury, no trial for our peer group. A full pardon, regardless of gender or rank.\"\n\nVance gripped the wooden bench and looked astonished. \"You ask to steer the very laws of the realm!\"\n\n\"It is a necessity,\" she affirmed. \"Or else we will strike. We will not sneak around, nor will we wander the shallow wastes as exiles. We will hum a war tune until the end.\"\n\nKael nodded. \"A sensible request. The privacy of your clan's affairs will remain intact. The tension is evident, but we can resolve this dispute.\"\n\nSlowly, the rage began to fade. They had managed to squeeze a truce from the jaws of a tragic fate. The art of negotiation was not about who could leap the farthest, but who could find solid ground.\n", "Alistair was a self-proclaimed wizard of modern engineering, though his peers seldom chose to acknowledge his merit. Today, in the grand hall of the national institution, he was about to initiate the most important presentation of his life. He felt an ache in his spine, a consequent symptom of carrying his heavy emotional baggage and a literal bundle of equipment down the lane from his suburb. He had decided to postpone his morning jog and didn't even have time to shave, leaving a rough scratch of beard on his chin. Looking at the prospect of failure, he was terrified. He had to cope with the chill of the auditorium, which felt like an arctic, polar wasteland covered in early morning frost. He would pave the way to the future, he thought, trying to derive courage from his underlying genius.\n\nThe crowd began to descend into their seats. They were a tough congress of critics, like a herd of cattle ready to graze on his mistakes. There was a noble ambassador wearing a delicate, precious pearl necklace, a stubborn merchant who dealt in dairy and flour, and a former navy lieutenant with a marine background who liked to exaggerate his war stories. There was even a wealthy widow clutching her purse, a blonde woman known for her greed and prejudice, who would frown at any illusion of incompetence. A local grocer sat next to her, looking suspicious. Rumors would circulate quickly if he failed, and criticism would invade his life.\n\nAlistair walked to the stage, carrying his invention: a portable appliance meant to alter the very fabric of matter. It looked like a bizarre blend of a microscope, a submarine, and a broom. He set it on a tin basin next to a decorative vase filled with ginger flowers. He had to utilize a complex wire and a metal hook to connect the bulb of the machine. The technology, he would claim, could conquer any physical limitation. He took a receipt from his pocket, rolled up his sleeve, and used it to wipe a stain off the machine's gleaming surface, pushing aside his reluctant thoughts of a tragedy. He set a stack of notes on the podium and smoothed his certificate of engineering, trying not to hesitate.\n\n\"Ladies and gentlemen,\" Alistair began, his voice a symphony of practiced confidence that masked his tremble. He pointed a metal rod at a poster behind him, depicting a grand parade of scientific progress. \"Through a fraction of nuclear energy, this device can devastate the handicap of physical distance!\" He turned a dial, careful not to crush the fuse. \"I shall now portray its power.\" He pulled a small caterpillar from a cupboard nearby. He placed it on a tiny strip of metal inside the machine. \"Watch as it travels via an invisible ray!\"\n\nHe pressed the button. Instead of a smooth teleportation, a loud bang like a bomb echoed. A disgusting grey paste began to drain from the machine. Smoke poured out like fireworks on an autumn night. The crowd gasped in horror. A phantom-like figure of energy seemed to emerge and rotate above the stage, casting a terrifying glance over the audience. The tide of the room shifted. A chemist in the front row dropped his notepad, creating a loud splash as his coffee fell. Meanwhile, Alistair felt ready to drown in his own embarrassment, his long-held dreams about to collapse. He wanted to swear out loud.\n\nThe spectacle was a disaster. Alistair felt his hopes shatter. It was a sin, a sheer insult to his heritage and his dynasty of inventors. He wanted to flee, perhaps commit social suicide and resign his license forever. He felt a deep grief, like staring at a coffin. The audience began to drag themselves out, muttering under their breath. Some looked with envy at those who had escaped early, while others were merely jealous of the sheer audacity. They treated him like an outlaw who had come to pursue a scam. He wanted to give them a souvenir of his failure, maybe a piece of the broken machine.\n\nBut then, a small miracle. He noticed a trace of movement near the exit. The caterpillar was there, unharmed! It had traveled past the artificial canal in the lobby and safely landed. It gave a little hop and began to swing on a leaf. A young optimist, perhaps a future groom, pointed with excitement, holding a fixed gaze on the insect. \"He did it!\" The crowd paused. He began to poke the person next to him. The rumor of success began to override the circumstance of the explosion. Alistair managed a smile, deciding to embrace the chaotic curve of events. He might need to mow the lawn and do laundry to calm his nerve later, but for now, he was a genius.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>
