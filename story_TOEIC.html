        .theme-toggle {

        }
        .theme-toggle:active { transform: scale(0.92); }

        /* ----- Transition for all elements ----- */
        body, body *, body *::before, body *::after {

        }

        /* ----- DARK MODE body ----- */
        body.dark-mode {
            background-color: #0f0f1a;

        body.dark-mode .theme-toggle {

        }

        body.dark-mode .vocab-word {

            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(129, 140, 248, 0.35);

        body.dark-mode .vocab-word:hover {

        body.dark-mode a.back-btn {
            color: #818cf8;

        body.dark-mode button {

        body.dark-mode button:hover {

    <style>
        /* ===== TRANSLATE POPUP ===== */
        .translate-popup {
            position: absolute;
            display: none;
            z-index: 1002;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            padding: 8px 16px;

            font-weight: 600;

            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }
        .translate-popup:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .translate-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #6366f1;
        }
        body.dark-mode .translate-popup {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);

        body.dark-mode .translate-popup::after {
            border-top-color: #8b5cf6;

        }
        .m-loading {
            font-size: 0.9em;
            color: #aaa;
            font-style: italic;
        }

</style>

        const baseStories = ["The corporate headquarters of Apex Solutions was a battlefield disguised as an open-plan office. Here, you didn't just work; you had to compare your department's budget against others and evaluate the competition, both external and internal. Eleanor, the VP of Marketing, was determined to stay on top of the shifting power dynamics. She had to address the growing influence of Julian, the new Director of Operations, before his initiative to restructure the departments ruined her strategy.\n\nEleanor walked into the overcrowded breakroom, catching a glimpse of Julian as he poured his coffee. They exchanged tight smiles. Their mutual engagement in this turf war was a poorly kept secret.\n\"I hope you're productive today, Julian,\" Eleanor said verbally, her tone laced with a casual superiority. She knew she had to bring in a strong win at the upcoming industry conference to secure her budget.\n\"Always,\" Julian replied. \"I constantly strive to facilitate our growth. In fact, I'm reviewing our provider contracts to avoid any duplicate fees and ensure unnecessary expenses do not recur.\"\n\nEleanor needed to launch a new software suite. It wasn't just a passing fad; it was an inspiration that could spark a revolution in the market. But Marcus, the Head of IT, was notoriously difficult to work with. He had the technical skill but lacked political savvy. Eleanor needed to convince him to prioritize her project.\n\nShe arranged to get in touch with Marcus, making sure to hold the session in a neutral location\u2014the small, affordable cafe across the street, far from the prying eyes of the company network.\n\"Marcus,\" Eleanor began, offering a sharp smile. \"We need to come up with a plan. We have an abundant variety of features, but we need to develop and assemble a working prototype beforehand.\"\nMarcus sighed, his confidence wavering. \"The process is complicated. We lack the server capacity to store that much data. If I allocate more resources to you, I'll have to shut down other projects. The system will throw a warning about a potential failure.\"\n\n\"You need to figure out a way,\" Eleanor insisted. \"If we don't present this when the executives attend the expo, the consequence is a massive reduction in our market share. We must attract the modern consumer, who wants durable, compatible solutions, not outdated legacy systems.\"\n\"But my team is out of bandwidth,\" Marcus argued. \"We primarily handle maintenance. You're asking us to take on a massive risk. To accommodate this, I\u2019d have to recruit an outside expert.\"\n\"Then do it. I can offer you extra headcount,\" Eleanor said. \"We can't let a minor weakness make us fold under pressure. I will promise you full credit during the presentation.\"\n\nMeanwhile, Julian was executing his own plans. He decided to conduct a full audit. He wanted to be in charge of operations completely and establish strict new policies that everyone had to abide by. He intended to enforce a strict dress code and a new practice for expense approvals. He drafted a massive document, a time-consuming endeavor, and sent it via express courier to the executive board as proof of his diligence. It was a thinly veiled attempt to expose Eleanor's departmental spending and initiate an inquiry.\n\nEleanor received a copy. She didn't hesitate to act. She knew Julian\u2019s reputation for being overly bureaucratic. She had to demonstrate that his policies would stifle the ability of the company to innovate.\n\nTo combat Julian, Eleanor needed an agreement from Marcus. She sent him a formal provision outlining their alliance.\n\"I will provide an assurance of additional funding for your department next quarter,\" she wrote. \"You just have to agree to expedite the layout of the new app interface. It must beready for the beta testers.\"\n\nMarcus agreed, signing the internal petition she drafted. However, the software was made of complex code, and an early version had a glitch where it would duplicate user files, restrict access, and delete random data off the hard disk. This would certainly require more debugging.\n\"We can ignore the minor bugs for now,\" Eleanor said when Marcus showed her the display. \"Just ensure the core characteristic works. We need the satisfaction of the board.\"\n\nAs the conference approached, the tension grew. Employees began to take part in the hushed gossip. Eleanor arranged to register a prime booth. She had to select the right promotional materials from stock. She needed to gather enough leads to justify the expense.\n\nJulian, who frequently looked for loopholes, attempted to trigger a cancellation of her booth space, citing an expiration in the vendor arrangement. He claimed there was no obligation for the company to cover the late fees. \"We cannot obligate the company to fund this,\" Julian argued to the board, hoping to determine her fate. \"I urge you to consider the financial drain.\"\n\nEleanor fought back fiercely. \"We have a contractual engagement with the event association,\" she countered. \"To back out now would imply instability. We must protect our brand. A substitution of a lesser marketing event won't work. We need the popularity this venue brings.\"\nThe board sided with Eleanor, appreciating her initiative. They decided to resolve the issue by approving the funds, provided she could guarantee a high return on investment.\n\nAt the event, Eleanor worked the floor. She used her skills of persuasion to pitch the new software, offering a comprehensive warranty and extended coverage to entice buyers. She promised to replace any defective licenses as needed. It was a bold move, but it worked. The attendees were impressed by the product's profile.\n\nBack at the office, Julian tried another angle. He decided to bring together a hiring committee to call in a new senior manager to oversee both marketing and IT, effectively diluting Eleanor and Marcus's power. He reviewed a candidate whose background and accomplishment list seemed commensurate with the role. He wanted someone who would apply rigid structures. The primary qualification he sought was compliance.\n\nEleanor caught wind of this and decided to evaluate the candidate herself. She ran a search on his past employment and found a critical flaw\u2014a history of failed projects. She chose to mention this casually to the CEO, framing it as a risk to their currently productive workflow.\n\nIn the final showdown, a quarterly review meeting, everyone was present. Eleanor presented her abundant leads from the conference. \"Our competition cannot match our current capacity,\" she declared. \"We are poised to consume a larger share of the market.\"\n\nJulian tried to pivot the discussion to his cost-reduction strategies, but Eleanor had already won the room. She had managed to reinforce her position. Marcus, seeing which way the wind blew, fully supported her, verifying the system's stability.\n\nIn the end, Julian was forced to revise his strict policies, realizing he couldn't physically shut down the momentum Eleanor had built. He had to accommodate her vision.\n\"I appreciate your efforts,\" Eleanor told Julian later, a hint of mockery in her voice. \"But next time you want to engage a party in a war, make sure you have the right strategy.\"\n\"I will follow up on that,\" Julian replied coldly, turning away.\n\nEleanor smiled. The practice of office politics was an art, and she had just painted a masterpiece. She had successfully managed to submit her finalized plans without interference. She knew she had to constantly be on her guard, but for now, she could enjoy her victory. She had made sure they would abide by her rules. She had navigated every specific trap Julian had set. Every registered asset was secure. She was the master of her domain.\n", "Elena sat in the glass-walled boardroom of her thriving enterprise. Over the years, she had worked tirelessly to generate unparalleled success. To keep up with the demands of the market, she made it a priority to hire top talent and set up rigorous training programs. She would often update her team on a daily basis, encouraging them to stay on track. Her old mentor, who was soon to retire, had taught her to always beaware of the delicate nature of business relationships, and she was acutely aware of every risk.\n\n\u201cYou must always negotiate from a position of strength,\u201d he used to say. \u201cEnsure you compensate your team fairly, offer a competitive wage, and provide a strong benefit package. Make sure they are eligible for a raise and a vested pension so they can work flexibly without worry. Never hesitate to reject a bad deal.\u201d\n\nElena was a leader her team could look up to. Because of her loyal staff\u2019s dedication and merit, it was obvious they would contribute massive value. She made sure to promote them and give them the recognition they deserved, allowing them to achieve their goals. They would constantly look to her for guidance, and she would look forward to their shared victories.\n\nAs her company began to expand and explore a new trend in luxury merchandise, Elena knew she couldn't bear any poor behaviour from her staff, especially at the checkout. Every single item had to undergo a strict and mandatory review to guarantee customer comfort. She wasn't just looking for a bargain; she wanted excellence. To diversify her offerings, the everyday function of the business had to maintain flawless quality, which was essentially a prerequisite for growth.\n\nShe worked hard to obtain a smooth source of supply, right down to the office stationery. It was integral that they accurately compile their catalogue to fulfill every order. By choosing the right carrier and shipper, she could minimize delays, ensure sufficient on-hand inventory, and ship goods seamlessly. She had to remember all these logistical layers during today\u2019s big meeting.\n\nToday, she was signing the most important contract of her career\u2014a massive joint venture. The customer had initially tried to impose an unfair charge and demanded a steep discount, hoping for overly efficient payment terms. But Elena provided a firm estimate and promised that if they ever made a mistake, her team would promptly rectify it. It was crucial to scan the tedious paperwork to verify every adjustment. She set her system to automatically subtract any liability so a random discrepancy wouldn't disturb the steady run of operations. This level of diligence was a true reflection of her professionalism.\n\nNow, sitting across from the client, Elena had to decide whether to accept the restricted clauses or pull out entirely. She had spent weeks reviewing the accounting and going through a grueling audit to ensure they could profitably accumulate a new asset and build up their market share. She had to reconcile her outstanding debt and carefully monitor the turnover.\n\nTo fund this transaction, she decided to cautiously borrow capital and take out a commercial mortgage with a substantial down payment. The financial models showed they could safely deduct operating costs, pay an annual dividend, and maintain a healthy balance in the budget.\n\nThe client's lead negotiator had an aggressive attitude, but Elena remained calm and conservative. She was ready to commit and invest her resource fund into a long term portfolio that promised a wise return. The calculation was precise.\n\nWith the deadline approaching to file the final documents, she had to carefully fill out the remaining pages, refusing to give up any hard-won concessions. Her spouse had acted as an unofficial sounding board the night before, helping her ensure she wouldn't owe an unexpected penalty or allow the partner to withhold a potential refund under obscure clauses.\n\nHer ultimate desire was to project a realistic target level for the overall forecast, putting every single detail into proper perspective. The preparation was complete. Even the translation of the international annex was flawless.\n\nElena picked up her pen, gave a confident smile, and placed her signature on the dotted line. The contract was signed.\n", "It was a typical morning for James, a senior supervisor whose responsibility it was to deal with international business expansion. It was time to arrive at the airport for embarkation protocols that he was familiar with. Checking his comprehensive directory of contacts and his itinerary, he waited for the agent to verify that his passport was valid. An overhead announcement warned of a delay due to an influx of passengers and a system outage. This kind of disruption could easily hamper a traveler, but James tried not to let it waste his time. To economize on the expense, his company would usually prohibit luxury travel, but today he had an equivalent option to fly deluxe, which would entitle him to a larger seat for the duration of the flight. As he waited to board, he decided to pick up a beverage from the adjacent lounge to assist in calming his anxiety. He felt anxious about the upcoming collaboration in Paris, knowing that any small circumstance could substantially alter his plans.\n\nOnce on the plane, the flight attendant offered him a blanket. The quiet cabin was conducive for him to concentrate and examine his agenda. He needed to systematically plan the completion of the project and complete his preliminary tasks. His primary goal was to ascertain whether the prospective site in the city center was right for a new outlet. He had to rely on a local guide to coordinate the visit. Ideally, the general consensus was that they had to move up the meeting to avoid a lengthy period of waiting. To predict the yield of the investment, James needed to assume control and incorporate a method to regulate the fluctuation in the market. The exchange rates would fluctuate daily, serving as an indicator of the economic condition. He didn't want to lock into a lease if the situation was poor. He could easily get out of it, but it would be best to distinguish between good and bad investments.\n\nUpon reaching his destination, James proceeded to the baggage claim and then went straight to the hotel lobby. Someone had inconsiderately left their luggage blocking the entrance. He was open to any suggestion that would enhance their business brand. They had to adhere to strict quality standards. His first priority was to inspect a new line of garment samples. He had to be perceptive and check every dimension and exact detail to ensure there was no defect. The fabric was designed to repel water and resist any wrinkle, looking uniformly perfect. If he found flaws, he would throw out the bad ones and take back the rest to the factory. To conclude this stage, they needed to conform to the high standards the majority of their customers expect.\n\nLater, they decided to bring up the matter of a new restaurant venture. This was not a random experiment but a carefully designed theme. The culinary profession was highly subjective, yet there was a clear demand for fine dining in the proximity of their offices. James met with an apprentice chef who wanted to impress him with a mix of ingredient choices to create a new flavor. The chef daringly chose to mix up traditional recipes to excite the appetite of any patron. James tried to judge the dishes without letting his own bias draw him away from the basic appeal. He had to remind himself not to forget that delivery and elegance were commonly expected. It was a burden that would ultimately fall to him to settle on a list that would satisfy multiple tastes. He had to narrow down the choices.\n\nAs the decade of his career taught him, every business deal is subject to scrutiny. He felt apprehensive about a compromise that might force him to relinquish control. He wanted to secure a contract that allowed them to extend their reach without taking risks. They had a short lead time, so they needed to go ahead and make progress. The individual who would occupy the leased space needed to accustom to the exact terms. To solve any logical issues, they decided to periodically research market trends and not opt for any excursion.\n", "It was the time of year to assess the personnel annually. Eleanor, the HR Director for the Oasis Wellness chain, had a full schedule. Her mission was to conduct an in depth review of employee performance, a procedure she took very seriously. Her approach was thorough and effective, designed to illuminate strengths and diagnose any potential issues. She wanted to broaden her understanding of the disparate departments, which ranged from medical care to hospitality. To quote the company founder, \"Performance is the pulse of our organization.\"\n\nShe began her day in a remote office to preclude any distraction. It was a busy morning that would coincide with the launch of their new advanced employee portal. Eleanor was punctual, a habit that helped her manage her time perfectly. She would usually check in with her assistant to confirm the agenda, ensuring no confusion would occur. \"Please notify the staff to wait in the relaxation lounge,\" she instructed, taking a sample of her morning tea.\n\nHer first appointment was with Elena, a dedicated housekeeper. Elena was nervous, her hands fidgeting over her crisp uniform. Eleanor offered a warm smile. \"I admire your collection of glowing feedback from guests,\" Eleanor began. \"Your service is significant. You consistently maintain a high rate of cleanliness.\"\n\"Thank you,\" Elena said. \"I try to anticipate what guests expect when they make a reservation.\"\n\"Your action to restore order in the VIP suites was evident to everyone. It's an aspect of your work we highly value. However, we must emphasize that taking on successive shifts can incur fatigue. I strongly urge you to limit your overtime to prevent burnout. As a recommendation, we'd like to authorize you to take an alternative weekend off. The company will reimburse your travel fare if you choose to take a trip. We want to offset your hard work with proper rest. We allow this because we deeply value you.\"\n\"That is a wonderful encouragement,\" Elena smiled. \"I intend to use my leisure time well to recharge.\"\n\nNext up was Julian, who helped organize entertainment for the resort. He wore a sharp, colorful suit, reflecting his vibrant role where he had to oversee a wide spectrum of activities.\n\"Julian, your creative instinct is unmatched,\" Eleanor said, glancing at his personnel record. \"Your plays often sell out, and the audience loves the dialogue you write. You rehearse the actors masterfully.\"\n\"I try to perform at my best,\" Julian replied. \"I want to expand our category of shows to appeal to a wider taste. Some guests prefer comedy, others drama.\"\n\"That's a good decision. But I must raise a minor criticism. We need to control the interaction with outside talent agencies. Some of the disparate acts you choose to combine can irritate certain guests. We should divide the performances into a tier system, perhaps grouping them separately by age group. We will acquire a new scheduling software to help with this.\"\n\"I understand the reason. I will disseminate a new calendar to link specific acts with the right demographic,\" Julian promised. \"I subscribe to that approach.\"\n\"Also, your representation of the brand is excellent. Your fashion sense always makes you approachable.\" Eleanor handed him his performance statement. \"We will continue to favor your vision. I will contact the finance department to approve your new budget.\"\n\nAfter a brief break to catch up on emails, Eleanor prepared for Dr. Vance, who ran the wellness clinic. To operate such a facility required a specialized license and absolute focus.\nVance was a serious man. His assignment was to oversee everything from a minor skin treatment to a major outpatient surgery.\n\"Doctor, your diagnosis accuracy is highly praised,\" Eleanor said. \"You utilize every instrument available to detect early health signs.\"\n\"Thank you. We use an advanced diagnostic tool to properly evaluate the patient. We never permit guesswork in our medical category.\"\n\"Your recent attainment of the new medical certification is pertinent to your upcoming salary increase,\" she noted. \"However, I must investigate a recent concern. A portion of the staff feels the new shift policy is too rigid. They say you rarely consult them on the roster, which goes against the team-building element in your job description.\"\n\"I admit, my focus can be intense. But regardless of any external factor, patient safety comes first.\"\n\"Agreed. But we must foster a collaborative environment. I'd like to designate a volunteer from your staff to act as a liaison. It would be a convenient way to monitor morale.\"\n\"I will respond to this positively. I will accompany the liaison in weekly meetings to evaluate the impact.\"\n\"Excellent. If any issues persist, I will refer you to a leadership coach, and we will meet regularly,\" Eleanor said, standing to escort him out.\n\nThe remainder of the day saw Eleanor evaluating the rest of the team. As the employees began to disperse, she tried to identify any lingering issues that could improve their overall experience. She did not want to disappoint anyone, but rather tempt them with new opportunities and a thrill for their career growth. Some training modules were optional, but most were necessary to constitute a unified workforce.\n\nAs she packed up, she reflected on the overview of the day. We will release the final report tomorrow, she thought. The result was clear: the employees had a strong range of skills, and they were ready to specialize further. It was a relatively successful review period, and Eleanor left her position at the desk feeling that the influence of proper feedback could truly illuminate a brighter future for everyone.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        let currentFontSize = 1.15;
        window.changeFontSize = function(direction) {
            currentFontSize += direction;
            if (currentFontSize < 0.8) currentFontSize = 0.8;
            if (currentFontSize > 3.0) currentFontSize = 3.0;
            const containers = document.querySelectorAll('.story-container');
            containers.forEach(c => {
                c.style.fontSize = currentFontSize + 'em';
            });
        };

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>

    <script>
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const data = allVocab[word.toLowerCase()];
                
                if (data) {
                    const display = document.getElementById('meaning-display');
                    
                    const checks = document.querySelectorAll('.check-item');
                    checks.forEach(c => {
                        if (c.textContent.trim().toLowerCase() === word.toLowerCase()) {
                            c.classList.add('check-used');
                        }
                    });

                    let defsHtml = '';
                    if (data.definitions && data.definitions.length > 0) {
                        data.definitions.forEach((def, index) => {
                            let posText = def.pos ? def.pos : 'Từ loại đang cập nhật';
                            let contextHtml = def.context ? `<div class="m-context">💡 <strong>Cách dùng ${index+1}:</strong> ${def.context}</div>` : '';
                            let exampleHtml = def.example ? `<div class="m-example">📖 <strong>Ví dụ:</strong> "${def.example}"</div>` : '';
                            
                            defsHtml += `
                                <div style="margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px;">
                                    <span class="m-type" style="margin-bottom:5px; display:inline-block;">${posText}</span>
                                    ${contextHtml}
                                    ${exampleHtml}
                                </div>
                            `;
                        });
                    } else {
                        defsHtml = `<div class="m-loading" style="margin-top: 10px;">(Dữ liệu đa nghĩa đang chờ cập nhật...)</div>`;
                    }

                    display.innerHTML = `
                        <div class="m-header">
                            <span class="m-word-title">${word}</span>
                        </div>
                        <div class="m-meaning">Nghĩa: ${data.meaning}</div>
                        ${defsHtml}
                    `;
                    display.style.display = 'flex';
                    
                    const rect = e.target.getBoundingClientRect();
                    let topPos = rect.bottom + window.scrollY + 8;
                    let leftPos = rect.left + window.scrollX;
                    
                    if (leftPos + display.offsetWidth > window.innerWidth + window.scrollX - 20) {
                        leftPos = window.innerWidth + window.scrollX - display.offsetWidth - 20;
                    }
                    if (leftPos < window.scrollX + 10) leftPos = window.scrollX + 10;
                    
                    display.style.top = topPos + 'px';
                    display.style.left = leftPos + 'px';
                    display.style.transform = 'none';
                    
                    const audio = document.getElementById('audio-player');
                    if (data.audio) {
                        audio.src = 'media/' + data.audio;
                        audio.play().catch(e => console.log('Audio error:', e));
                    }

                    if (window.meaningTimeout) clearTimeout(window.meaningTimeout);
                    window.meaningTimeout = setTimeout(() => {
                        display.style.display = 'none';
                    }, 12000);
                }
            }
        });

        // Click outside to hide
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.vocab-word') && !e.target.closest('#meaning-display')) {
                const display = document.getElementById('meaning-display');
                if (display) display.style.display = 'none';
            }
        });
</script>
