        const baseStories = ["The shifting coastline was a distant memory. Here in the inland prairie, everything was an arid, barren wasteland. The drought was ongoing, turning once dense forests into hostile plains. The temperature regularly soared past forty degrees celsius. It felt like an infinite furnace.\n\nDr. Aris, a competent bachelor holding a diploma in sociology and geology, wiped moisture from his brow. His intellect was keen, his analytic mind shaped by the grueling realities of the climate collapse. He lived in a rugged camp built to adjoin the ruins of an ancient abbey, whose crumbling arches looked like a bizarre cathedral under the celestial night sky. Once, this place enjoyed a temperate ecology, brimming with abundant aquatic life. Now, the dearth of water made the entire biosphere vulnerable. His only companion was a wild dog.\n\nFinding sustenance was a mundane and tedious chore. The scarce supply of edible roots required him to allot hours of repetitive digging. He would extract the coarse tubers, careful not to fracture a limb on the hard rocks or trigger a blinding migraine from the sun's glare. His daily intake was a paltry meal cooked in a cracked ceramic pot, a meager culinary feat that helped him tolerate the hunger. He would often have to fast, building a tolerance to starvation. Yet, he was adept and highly resourceful, managing to secure a hidden cache of seeds.\n\nFar to the north, the affluent elites lived in a prominent headquarters, trying to dominate what was left. Every administrator there was corrupt. They would manipulate the infrastructure and retail merchandise to generate immense revenue. They'd offer a fake subsidy or a direct bribe to legislate total control, only to dispose of their toxic rubbish in the dying rivers. It was an outrage to see them violate every legitimate environmental protocol. Such deliberate cruelty would appall anyone with a shred of empathy. Their only incentive was greed, reducing human dignity to a mere transaction.\n\nAris refused to just gripe or grumble about the dire situation. He wouldn't opt for convenience. He took a silent oath to rectify this injustice. He felt a sudden impulse to commence a quest of immense significance. He needed to assess the damage and devise a remedy.\n\nUsing his expertise in physiology and high-level calculus, Aris began to speculate on a solution. He studied theoretical texts, combining the precise laws of relativity with ancient mythology\u2014fanciful, fabulous tales of rain gods\u2014to gain a peculiar insight. His goal was to harness a synthetic molecule, modifying the nucleus of a mutated indigenous plant so it could efficiently digest toxins and release pure water vapor. He had to be a proficient scientist; any mistake could impair his cognitive function or ruin the reproductive cycle of the flora, potentially attracting a deadly parasite that had already killed his spouse years prior.\n\nIn a makeshift pharmaceutical lab he assembled near a jagged ridge, Aris worked with haste. The altitude made it hard to breathe, but he would not let the thin air deter him. An audit of his supplies showed he had ample materials, though he lacked a crucial radioactive isotope. Nonetheless, he pushed forward. He managed to automate the system, preparing to implement the final sequence.\n\nHe watched a collision of storm clouds gather in close proximity. He had to assert his dominance over the elements and excel. As the machine powered up with a powerful thrust, the essence of the clouds began to change. He didn't do this for publicity or reward. He did it because he could not let another year elapse while the earth suffered a terminal fate. He would not deprive the latter generations of a future. Anyone eligible to help had long given up, leaving Aris in his ragged clothes to undergo this trial alone.\n\nAs the first drops of rain fell, a profound optimism washed over him. The subsequent hours proved his machine worked, ready to astonish the world. The long duration of the dry age was finally breaking.\n", "The city of Oakhaven, located on a sprawling peninsula, was undergoing a spectacular yet brutal renaissance of rapid urbanization. What was once a quiet town defined by archaic architecture and a benevolent, slow-paced culture had morphed into a gorgeous but crude machine of modern capitalism. The new skyline, a dense grid of glass and steel, sought to impose its dominance over the natural hemisphere. To the indifferent capitalist, this expansion was an inevitable asset, a surefire way to maximize monetary gain. However, the overall aspect of the city began to degrade as the sheer proportion of new buildings threatened to saturate the landscape, leaving only an obscure imprint of its medieval past.\n\nDown by the old docks, where a fleet of obsolete fishing boats with a rotting naval mast still sat, an old man named Elias watched the rise of a new corporate facility. Elias, a former accountant who chose to dedicate his time to anthropology as a late-in-life undergraduate, felt deep contempt for the changes. The managerial elite had decided to situate their newest enterprise right over the historic district, destroying the town's precious legacy. They managed to finance the acquisition of the land through aggressive means, aiming to coordinate multiple crews in a consecutive rush to build. \n\nA muscular foreman named Kael, adorned with a fading anchor tattoo, stood in a masculine posture, trying to supervise the simultaneous demolition and construction. Kael had to ditch his moral reservations to do the job. The builders were rarely considerate of the local residents. They tore down every historical ornament and threw them onto a heap of rubble. A rack of blueprints outlined the upcoming destruction, leaving no spatial room for the old community.\n\nThe drawback to this growth was immense. The influx of hopeful workers led to acute overcrowding. In the shadow of a new marble monument dedicated to commercial prestige, squatter camps made of corrugated iron and cardboard sprang up. Malnutrition became rampant as the consumption of fresh food gave way to cheap, imported soy products and heavily saturated fats. Dr. Aris, a dedicated humanitarian, set up a makeshift clinic. She worked tirelessly to diminish the suffering, handing out adequate medication and writing a prescription for every ailing pedestrian who walked in. Often, she had to rely on a donated respirator to treat the severe respiratory illnesses caused by the external dust from the sites. The city's dependence on outside help grew daily.\n\nBefore the boom, locals used to sow seeds in fertile fields, taking the precaution to irrigate the land with the waters of a clear brook. Now, they had to trade the spade for factory tools. The old ways of farming were seen as a mere fad, an outdated misconception that couldn't feed a metropolis. The simplicity of peeling a fresh fruit\u2014to just peel an apple from a local blooming bud\u2014was lost. Instead, they had to import synthetic goods. The earth was covered with a hard crust of asphalt, and the sweet smell of nature was replaced by the stench of industrial wax and exhaust.\n\nMeanwhile, the executives held an elaborate banquet to celebrate. They sat in an exquisite hall, eating fine foods that would cater to their lavish tastes, demonstrating a clear partiality for luxury over charity. A glowing biography of the CEO, a man notorious for his ruthless aggression, was handed out as a complimentary accessory to the guests. During the speeches, they would applaud and clap at the informative presentation. The impersonal nature of the event highlighted a deep ignorance of the dilemma outside. They assumed their innate competence would confer prosperity on all, a premise many a skeptic sought to refute. They wanted to inflate their egos, ignoring the preliminary warnings of environmental collapse.\n\nElias refused to be a mere spectator. He decided to narrate the true story of Oakhaven. He gathered his notes to disprove the hypothesis that urbanization was entirely beneficial. He noticed the stark symmetry between the wealthy and those they chose to oppress. He sought to weave these facts into a masterpiece of journalism. He observed a blind woman reading braille on a brass plaque, her fingers tracing the words. Her optic nerves might be damaged, but one could infer she saw the truth better than the sighted. She carried a small leather pouch containing seeds, a silent rebellion to strive against the concrete. She was a vital component of the resistance.\n\nSuddenly, a spontaneous protest erupted. The workers, feeling the nausea of exhaustion, refused to work. They demanded better criteria for their living conditions. The developers tried to facilitate a meager boost in wages, but the crowd's demands were not compatible with corporate greed. The corporation didn't revere their hard work or entitle them to a fair share. An old hound barked as the crowd surged forward. Panicking, the developers tried to escort their executives away. \n\nElias watched, knowing he had to update his manuscript immediately. The mayor was forced to appoint a new committee from the university faculty to address the crisis. The city, now a massive cube of glass, was no longer a sanctuary. It was a radical shift in human history. Likewise, Dr. Aris continued her medical work, driven by unyielding virtue. The feedback from the streets was undeniable: the people would compel the system to change, or else the city would collapse under its own weight. To specify the exact moment the tide turned was difficult, but the revolution had undeniably begun.\n", "In the modern realm, it was a commonplace occurrence for a mere notion to go viral. Julian, a skinny graduate student in the humanities department, was an undeniable social media addict. His life was a chaotic aggregate of digital input, frequent notifications, and deceptive profiles. He felt captive to the glowing screen, allowing the constant stimulus to distract him from his genuine reality. It was a prevalent and chronic problem that threatened his academic discipline, his ethics, and his overall outlook on life.\n\nJulian\u2019s sibling, a bilingual linguist and a strong proponent of mental health, tried to intervene. \"You need to sever this connection, Julian. It\u2019s causing an erosion of your integrity.\" She urged him to meditate, to disconnect, and to enjoy a straightforward life. But the pull was like a magnet. The digital world was his anchor, though it often felt more like a weight trying to submerge him than a buoy keeping him afloat.\n\nOne evening, Julian decided to brainstorm a new tactic to gain followers. He wanted to manufacture a controversy to provoke the masses. He decided to hack into a university database and compress some intricate administrative files. His goal was to find a vague scandal, something plausible but scandalous enough to distort the truth and compound his fame. He found a file about the university administration and their budget for the new biotechnology and archeology departments. He noticed an overlap in the funds, a ratio that didn\u2019t quite correspond to the explicit framework set by the principal donor. A suspicion of fraud began to form in his mind.\n\nHe decided to post about it. He didn't cite any real sources; he just used colloquial language and secondhand gossip to implicate the university president. He claimed the funds meant for prehistoric research and an archeological dig were being used to manufacture fluorescent cosmetics and fund a weird quantum microchip project, treating the whole thing like a massive conspiracy. He suggested they were trying to clone humans, use acid to dissolve evidence, and build a hydrogen bomb. He added an aggressive caption, ready to combat any foe who disagreed.\n\nThe post was a comet of chaos, leaving a crater of debris in its wake. It had the power to precipitate a catastrophe. Within a phase of a few hours, the post began to spiral out of control. The university auditorium was soon filled with a furious corps of fellow students, demanding amnesty for whistleblowers. The courtyard became an arena of protest, complete with angry graffiti on the sacred walls of the old estate. Julian felt his brief reign as a hero ending abruptly.\n\nJulian was astounded. He had expected a few likes, maybe a nick to his ego if it failed, but not this astronomical reaction. The gulf between his dumb prank and the reality of the situation was terrifying. A stab of guilt hit him. He felt himself falling down a dark shaft of despair. His guardian, a strict attorney, had to step in. \"This is not a game, Julian. You could face a lawsuit. The university can terminate your enrollment and demand you pay back your tuition.\"\n\nThe administration brought in a neutral referee to investigate the claims and acted accordingly. They decided to designate an expert to evaluate the aggregate data. The investigation revealed no fraud; the funds were just allocated in a complex circuit to offset costs, a legal mechanism to minimize taxes. There was no secret clone project, no weird hydrogen or acid experiments, no biotechnology meant to manipulate metabolism, cure diabetes, and lower cholesterol using nectar from a rare plant. It was all a deceptive illusion born of social media, and people reacted with disgust.\n\nJulian felt a deep despair. He had acted out of a distorted desire for attention, treating his followers like intimate kin. His actions had a severe context. He tried to dash out an apology where the main theme was taking responsibility, but the internet was immune to his excuses, like an antibiotic failing to clear an infection. People were quick to attribute malice to his actions, and he felt a sharp pinch of regret.\n\nTo avoid a lawsuit, Julian's attorney negotiated a coalition with the administration. Julian would have to do community service at the local dock, helping to grease the gears of old ships and clear away rust. He also had to participate as a participant in an explicit program to eliminate his social media dependency. He was stripped of his smartphone and given an equivalent device with no apps, just a slot for a basic SIM card.\n\nDuring his service, he worked under the fore of an old sailor who taught him about the breadth and circumference of the real world. He learned to tie a proper knot and knit a warm scarf, a calming ritual that grounded him. He realized that a simple atom of truth was worth more than an astronomical amount of likes. He learned to appreciate the complement of a quiet evening, the beauty of a crescent moon, and the importance of genuine connection.\n\nSocial media had been a parachute that failed to open, sending him plunging into a world of trouble. Now, he was slowly rebuilding. He had to refine his character, restrict his impulses, and embrace a life free of the constant need to embed himself in the digital sphere, no longer prone to such mistakes.\n", "Once upon a time in a school district on the brink of becoming completely bankrupt, an arrogant executive named Mr. Vance ruled with an iron fist. The status of education was in a state of gloom. The curriculum was a rigid artifact, a primitive fossil from a previous era. The classrooms were solitary confinement cells, gigantic rooms lacking any aesthetic appeal, where students were forced to conform to arbitrary rules or face being an outcast they would expel.\n\nDr. Aris, a sociable and talkative pioneer of dynamic teaching, sought to revive the system. He proposed an epic transition, breaking away from the typical educational convention to merge different subjects. He presented a preview of his forthcoming autobiography, which contained an excerpt detailing his vision for Education Reforms.\n\n\"The ultimate goal,\" Aris said, addressing the school board on behalf of the personnel and students, \"is to adapt and improve. We need a compromise between old and new, an authentic hybrid model whereby students can thrive.\"\n\nThe school building itself needed an overhaul too. The landlord, a nasty crook who held the lease and a massive mortgage, had neglected the plumbing and utility bills. The hygiene standards were so poor they couldn't be considered hygienic; a sticky residue covered the floors, and a termite infestation was eating every twig of the wooden structures. A fragile antique desk was all that remained of the original furniture. Aris planned to mend the facility, furnish it with trendy desks, and insulate the walls against the winter shiver caused by a nearby glacier. He also aimed to secure philanthropy to pay off the building's debt, ensuring the school wasn't treated like a mere tenant.\n\nAris proposed replacing mandatory standardized tests\u2014a burden that would often overwhelm students with an overload of internal stress\u2014with relevant, real-world projects. He wanted to employ new teachers, treating every applicant with gracious respect, to recruit those who understood the spectrum of student needs. He would register them for a chronology of training sessions to help them perceive the enigma of adolescent biological and cellular development.\n\nOne of his ideas was a hands-on science class where students could study heredity using a real orangutan or observe a reptile in a giant aquarium. They would learn about the primate lineage without relying on a stereotype or bias. He envisioned an outdoor trail leading to a canyon and a creek, where students could study nature. There, they wouldn't just read about a tusk or a wild animal; they would roam the environment, experiencing the globe firsthand.\n\nHowever, Vance considered these reforms a fantasy. \"This isn't a welfare program,\" Vance would humiliate Aris during meetings. \"We can't substitute hard work with a walk on a trail or a loaf of bread. The norm must precede your radical ideas.\"\n\nBut Aris didn't let Vance's incline toward negativity stall his efforts. Aris's perception was that Vance was just a tramp of the old guard, a lonely monarch clinging to his majesty. Aris, acting as a diplomat, brought in a respected surgeon to speak about therapy and the longevity of the human brain under proper educational stimulation. The surgeon explained how the sequence of learning could transplant old habits with new, healthy ones, just as one might transfer a healthy organ to a recipient.\n\nAris also brought in an oracle of educational renown, a woman who seemed to have supernatural wisdom. She spoke of how students should not be forced into an orbit around a strict curriculum, like planets in a galaxy bound by gravity, but should be allowed to explore the full sphere of human knowledge. She emphasized that every fragment of information could radiate meaning if taught with innocence and curiosity.\n\nTo fund his reforms, Aris had to secure new currency. He organized a reunion of successful alumni. The event featured a lyric performance and a showcase of student craft. Aris offered a refund to any donor who felt their money wasn't making at least a minimal impact. He managed to tow the community along, building a horizontal power structure rather than a top-down one.\n\nIn the end, Vance tried to delay the vote, but his attempts were a mere flap of a bird's wings against a storm. Aris's comprehensive overview of the reforms proved undeniable. The school board approved the plan. Aris was able to rig a new system of moderate assessments. The issues of fatigue and boredom that used to recur were effectively solved.\n\nAris wanted to provide an environment where learning was a joyful rite of passage, not a chore. He instructed teachers to take inventory of their students' passions, thereby ensuring that no student felt compelled to retreat inward. A quiet hum of focused energy replaced the previous chaos. \n\nInstead of having doctors prescribe medication for restless students, teachers would guide them to their respective areas of intrigue, encouraging them to probe deep into their interests. Even if a naughty student were to misplace their assignment, the system was designed to help them recover, so long as they remained punctual in their commitment to learning.\n\nThe school became a beacon, a place of learning where students didn't just drill facts but truly grew. It was the ultimate victory for an extension of educational reforms, proving that even the most broken system could be mended.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>
