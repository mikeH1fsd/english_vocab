    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.8; padding: 20px; max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }

        button:hover { background-color: #2980b9; }
        button.active { background-color: #e67e22; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
        .story-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1.15em; display: none; }
        .story-container.active { display: block; }
        h2 { color: #34495e; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; margin-top: 20px; }
        .vocab-word { background-color: #ffeaa7; padding: 2px 5px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #d35400; transition: background-color 0.3s; }
        .vocab-word:hover { background-color: #fdcb6e; }
        #meaning-display { position: absolute; background: #2d3436; color: white; padding: 15px; border-radius: 8px; font-size: 1.1em; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: none; z-index: 1000; text-align: left; max-width: 350px; flex-direction: column; }
        #meaning-display .m-word-title { display: block; font-size: 1.3em; font-weight: bold; color: #fdcb6e; margin-bottom: 5px; text-transform: capitalize; text-align: left; }
        #meaning-display .m-meaning { font-weight: bold; margin-bottom: 10px; }
        .meaning-word { color: #fdcb6e; font-weight: bold; text-transform: capitalize; }
        .stats, .checklist-container { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .check-item { padding: 5px 10px; border-radius: 4px; font-size: 0.85em; border: 1px solid #ddd; }
        .check-used { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        p { margin-bottom: 15px; }
    </style>

    <style>
        /* ===== PREMIUM DARK MODE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e9ef, #ffffff);
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -2px -2px 8px rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
            box-shadow: 6px 6px 15px rgba(0,0,0,0.15), -3px -3px 10px rgba(255,255,255,0.9);
        }
        .theme-toggle:active { transform: scale(0.92); }

        /* ----- Transition for all elements ----- */
        body, body *, body *::before, body *::after {
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }

        /* ----- DARK MODE body ----- */
        body.dark-mode {
            background-color: #0f0f1a;
            color: #d4d4e0;
        }

        /* Toggle button in dark */
        body.dark-mode .theme-toggle {
            background: linear-gradient(145deg, #1e1e30, #2a2a44);
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5), -2px -2px 8px rgba(60,60,90,0.2);
        }

        /* ----- Story pages ----- */
        body.dark-mode .story-container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: #d4d4e0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        body.dark-mode h1 {
            background: linear-gradient(135deg, #667eea, #764ba2) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        body.dark-mode h2 {
            color: #a78bfa;
            border-bottom: 2px solid rgba(167, 139, 250, 0.2);
        }

        body.dark-mode h3 { color: #c4b5fd; }

        body.dark-mode .stats,
        body.dark-mode .checklist-container {
            background: rgba(30, 30, 50, 0.8);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        body.dark-mode .check-item {
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            border-radius: 6px;
        }

        body.dark-mode .check-used {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: none;
        }

        body.dark-mode .vocab-word {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(129, 140, 248, 0.35);
            box-shadow: none;
            text-shadow: none;
        }
        body.dark-mode .vocab-word:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #c7d2fe;
            border-bottom-color: rgba(165, 180, 252, 0.5);
            box-shadow: none;
            transform: none;
        }

        body.dark-mode a.back-btn {
            color: #818cf8;
        }
        body.dark-mode a.back-btn:hover { color: #a5b4fc; }

        body.dark-mode button {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        body.dark-mode button:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }
        body.dark-mode button.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }

        body.dark-mode #meaning-display {
            background: linear-gradient(145deg, #1e1e30, #2a2a44);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        body.dark-mode p { color: #b0b0c0; line-height: 2; }
        body.dark-mode .story-container { font-size: 1.1em; letter-spacing: 0.01em; }

        /* ----- Index / Hub page ----- */
        body.dark-mode .card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        body.dark-mode .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.15);
            transform: translateY(-8px);
        }
        body.dark-mode .card::before {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        body.dark-mode .card h2 { color: #818cf8; }
        body.dark-mode .card p { color: #9ca3af; }
        body.dark-mode .btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
        }
        body.dark-mode .card:hover .btn {
            background: linear-gradient(135deg, #6366f1, #818cf8) !important;
        }

        body.dark-mode .header p { color: #9ca3af; }

    </style>

    <style>
        /* ===== TRANSLATE POPUP ===== */
        .translate-popup {
            position: absolute;
            display: none;
            z-index: 1002;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }
        .translate-popup:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .translate-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #6366f1;
        }
        body.dark-mode .translate-popup {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        }
        body.dark-mode .translate-popup:hover {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        body.dark-mode .translate-popup::after {
            border-top-color: #8b5cf6;
        }

    
        /* Extra styles for meaning popup */
        #meaning-display {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            min-width: 300px;
        }
        .m-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }
        .m-word-title {
            font-size: 1.3em;
            color: #fdcb6e;
            font-weight: bold;
            text-transform: capitalize;
        }
        .m-type {
            font-size: 0.8em;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-style: italic;
        }
        .m-meaning {
            font-size: 1.1em;
            font-weight: bold;
        }
        .m-example {
            font-size: 0.95em;
            color: #e0e0e0;
            font-style: italic;
            border-left: 3px solid #fdcb6e;
            padding-left: 10px;
            margin-top: 5px;
        }
        .m-loading {
            font-size: 0.9em;
            color: #aaa;
            font-style: italic;
        }

</style>
</head>

    <script>
        const allVocab = {"allot": {"meaning": "phân công, phân việc, phân phối", "audio": "4000B5_allot.mp3", "definitions": [{"pos": "Động từ", "context": "Phân bổ, giao phó (công việc, thời gian, tiền bạc).", "example": "The board will allot the funds to various departments."}]}, "appall": {"meaning": "kinh hoàng, kinh sợ, kinh hãi", "audio": "4000B5_appall.mp3", "definitions": [{"pos": "Động từ", "context": "Làm kinh hãi, làm kinh hoàng, gây sốc.", "example": "The conditions in the prison appalled the human rights workers."}]}, "cache": {"meaning": "nơi giấu, nơi trữ (lương thực, đạn dược... nhất là các nhà thám hiểm để dùng sau này)", "audio": "4000B5_cache.mp3", "definitions": [{"pos": "Danh từ", "context": "Nơi cất giấu hoặc dự trữ (thực phẩm, vũ khí) / Bộ nhớ đệm trong máy tính.", "example": "They found a cache of stolen goods in the warehouse."}, {"pos": "Động từ", "context": "Cất giấu, lưu trữ vào bộ nhớ đệm.", "example": "The browser caches images so they load faster next time."}]}, "convenience": {"meaning": "sự tiện lợi, sự thuận lợi; sự thích hợp", "audio": "4000B5_convenience.mp3", "definitions": [{"pos": "Danh từ", "context": "Sự tiện lợi, thuận tiện cho người dùng.", "example": "The hotel offers the convenience of online check-in."}]}, "dearth": {"meaning": "sự thiếu, sự khan hiếm", "audio": "4000B5_dearth.mp3", "definitions": [{"pos": "Danh từ", "context": "Sự thiếu hụt, khan hiếm nghiêm trọng (thường về tài nguyên, thông tin).", "example": "There is a dearth of reliable information on the subject."}]}, "deliberate": {"meaning": "thận trọng, có tính toán", "audio": "4000B5_deliberate.mp3", "definitions": [{"pos": "Tính từ", "context": "Cố ý, có tính toán, chủ tâm.", "example": "It was a deliberate attempt to sabotage the project."}, {"pos": "Động từ", "context": "Thảo luận, cân nhắc kỹ lưỡng (thường dùng trong bồi thẩm đoàn hoặc ủy ban).", "example": "The jury deliberated for three days before reaching a verdict."}]}, "dire": {"meaning": "thảm khốc         const baseStories = ["The shifting coastline was a distant memory. Here in the inland prairie, everything was an arid, barren wasteland. The drought was ongoing, turning once dense forests into hostile plains. The temperature regularly soared past forty degrees celsius. It felt like an infinite furnace.\n\nDr. Aris, a competent bachelor holding a diploma in sociology and geology, wiped moisture from his brow. His intellect was keen, his analytic mind shaped by the grueling realities of the climate collapse. He lived in a rugged camp built to adjoin the ruins of an ancient abbey, whose crumbling arches looked like a bizarre cathedral under the celestial night sky. Once, this place enjoyed a temperate ecology, brimming with abundant aquatic life. Now, the dearth of water made the entire biosphere vulnerable. His only companion was a wild dog.\n\nFinding sustenance was a mundane and tedious chore. The scarce supply of edible roots required him to allot hours of repetitive digging. He would extract the coarse tubers, careful not to fracture a limb on the hard rocks or trigger a blinding migraine from the sun's glare. His daily intake was a paltry meal cooked in a cracked ceramic pot, a meager culinary feat that helped him tolerate the hunger. He would often have to fast, building a tolerance to starvation. Yet, he was adept and highly resourceful, managing to secure a hidden cache of seeds.\n\nFar to the north, the affluent elites lived in a prominent headquarters, trying to dominate what was left. Every administrator there was corrupt. They would manipulate the infrastructure and retail merchandise to generate immense revenue. They'd offer a fake subsidy or a direct bribe to legislate total control, only to dispose of their toxic rubbish in the dying rivers. It was an outrage to see them violate every legitimate environmental protocol. Such deliberate cruelty would appall anyone with a shred of empathy. Their only incentive was greed, reducing human dignity to a mere transaction.\n\nAris refused to just gripe or grumble about the dire situation. He wouldn't opt for convenience. He took a silent oath to rectify this injustice. He felt a sudden impulse to commence a quest of immense significance. He needed to assess the damage and devise a remedy.\n\nUsing his expertise in physiology and high-level calculus, Aris began to speculate on a solution. He studied theoretical texts, combining the precise laws of relativity with ancient mythology\u2014fanciful, fabulous tales of rain gods\u2014to gain a peculiar insight. His goal was to harness a synthetic molecule, modifying the nucleus of a mutated indigenous plant so it could efficiently digest toxins and release pure water vapor. He had to be a proficient scientist; any mistake could impair his cognitive function or ruin the reproductive cycle of the flora, potentially attracting a deadly parasite that had already killed his spouse years prior.\n\nIn a makeshift pharmaceutical lab he assembled near a jagged ridge, Aris worked with haste. The altitude made it hard to breathe, but he would not let the thin air deter him. An audit of his supplies showed he had ample materials, though he lacked a crucial radioactive isotope. Nonetheless, he pushed forward. He managed to automate the system, preparing to implement the final sequence.\n\nHe watched a collision of storm clouds gather in close proximity. He had to assert his dominance over the elements and excel. As the machine powered up with a powerful thrust, the essence of the clouds began to change. He didn't do this for publicity or reward. He did it because he could not let another year elapse while the earth suffered a terminal fate. He would not deprive the latter generations of a future. Anyone eligible to help had long given up, leaving Aris in his ragged clothes to undergo this trial alone.\n\nAs the first drops of rain fell, a profound optimism washed over him. The subsequent hours proved his machine worked, ready to astonish the world. The long duration of the dry age was finally breaking.\n", "The city of Oakhaven, located on a sprawling peninsula, was undergoing a spectacular yet brutal renaissance of rapid urbanization. What was once a quiet town defined by archaic architecture and a benevolent, slow-paced culture had morphed into a gorgeous but crude machine of modern capitalism. The new skyline, a dense grid of glass and steel, sought to impose its dominance over the natural hemisphere. To the indifferent capitalist, this expansion was an inevitable asset, a surefire way to maximize monetary gain. However, the overall aspect of the city began to degrade as the sheer proportion of new buildings threatened to saturate the landscape, leaving only an obscure imprint of its medieval past.\n\nDown by the old docks, where a fleet of obsolete fishing boats with a rotting naval mast still sat, an old man named Elias watched the rise of a new corporate facility. Elias, a former accountant who chose to dedicate his time to anthropology as a late-in-life undergraduate, felt deep contempt for the changes. The managerial elite had decided to situate their newest enterprise right over the historic district, destroying the town's precious legacy. They managed to finance the acquisition of the land through aggressive means, aiming to coordinate multiple crews in a consecutive rush to build. \n\nA muscular foreman named Kael, adorned with a fading anchor tattoo, stood in a masculine posture, trying to supervise the simultaneous demolition and construction. Kael had to ditch his moral reservations to do the job. The builders were rarely considerate of the local residents. They tore down every historical ornament and threw them onto a heap of rubble. A rack of blueprints outlined the upcoming destruction, leaving no spatial room for the old community.\n\nThe drawback to this growth was immense. The influx of hopeful workers led to acute overcrowding. In the shadow of a new marble monument dedicated to commercial prestige, squatter camps made of corrugated iron and cardboard sprang up. Malnutrition became rampant as the consumption of fresh food gave way to cheap, imported soy products and heavily saturated fats. Dr. Aris, a dedicated humanitarian, set up a makeshift clinic. She worked tirelessly to diminish the suffering, handing out adequate medication and writing a prescription for every ailing pedestrian who walked in. Often, she had to rely on a donated respirator to treat the severe respiratory illnesses caused by the external dust from the sites. The city's dependence on outside help grew daily.\n\nBefore the boom, locals used to sow seeds in fertile fields, taking the precaution to irrigate the land with the waters of a clear brook. Now, they had to trade the spade for factory tools. The old ways of farming were seen as a mere fad, an outdated misconception that couldn't feed a metropolis. The simplicity of peeling a fresh fruit\u2014to just peel an apple from a local blooming bud\u2014was lost. Instead, they had to import synthetic goods. The earth was covered with a hard crust of asphalt, and the sweet smell of nature was replaced by the stench of industrial wax and exhaust.\n\nMeanwhile, the executives held an elaborate banquet to celebrate. They sat in an exquisite hall, eating fine foods that would cater to their lavish tastes, demonstrating a clear partiality for luxury over charity. A glowing biography of the CEO, a man notorious for his ruthless aggression, was handed out as a complimentary accessory to the guests. During the speeches, they would applaud and clap at the informative presentation. The impersonal nature of the event highlighted a deep ignorance of the dilemma outside. They assumed their innate competence would confer prosperity on all, a premise many a skeptic sought to refute. They wanted to inflate their egos, ignoring the preliminary warnings of environmental collapse.\n\nElias refused to be a mere spectator. He decided to narrate the true story of Oakhaven. He gathered his notes to disprove the hypothesis that urbanization was entirely beneficial. He noticed the stark symmetry between the wealthy and those they chose to oppress. He sought to weave these facts into a masterpiece of journalism. He observed a blind woman reading braille on a brass plaque, her fingers tracing the words. Her optic nerves might be damaged, but one could infer she saw the truth better than the sighted. She carried a small leather pouch containing seeds, a silent rebellion to strive against the concrete. She was a vital component of the resistance.\n\nSuddenly, a spontaneous protest erupted. The workers, feeling the nausea of exhaustion, refused to work. They demanded better criteria for their living conditions. The developers tried to facilitate a meager boost in wages, but the crowd's demands were not compatible with corporate greed. The corporation didn't revere their hard work or entitle them to a fair share. An old hound barked as the crowd surged forward. Panicking, the developers tried to escort their executives away. \n\nElias watched, knowing he had to update his manuscript immediately. The mayor was forced to appoint a new committee from the university faculty to address the crisis. The city, now a massive cube of glass, was no longer a sanctuary. It was a radical shift in human history. Likewise, Dr. Aris continued her medical work, driven by unyielding virtue. The feedback from the streets was undeniable: the people would compel the system to change, or else the city would collapse under its own weight. To specify the exact moment the tide turned was difficult, but the revolution had undeniably begun.\n", "In the modern realm, it was a commonplace occurrence for a mere notion to go viral. Julian, a skinny graduate student in the humanities department, was an undeniable social media addict. His life was a chaotic aggregate of digital input, frequent notifications, and deceptive profiles. He felt captive to the glowing screen, allowing the constant stimulus to distract him from his genuine reality. It was a prevalent and chronic problem that threatened his academic discipline, his ethics, and his overall outlook on life.\n\nJulian\u2019s sibling, a bilingual linguist and a strong proponent of mental health, tried to intervene. \"You need to sever this connection, Julian. It\u2019s causing an erosion of your integrity.\" She urged him to meditate, to disconnect, and to enjoy a straightforward life. But the pull was like a magnet. The digital world was his anchor, though it often felt more like a weight trying to submerge him than a buoy keeping him afloat.\n\nOne evening, Julian decided to brainstorm a new tactic to gain followers. He wanted to manufacture a controversy to provoke the masses. He decided to hack into a university database and compress some intricate administrative files. His goal was to find a vague scandal, something plausible but scandalous enough to distort the truth and compound his fame. He found a file about the university administration and their budget for the new biotechnology and archeology departments. He noticed an overlap in the funds, a ratio that didn\u2019t quite correspond to the explicit framework set by the principal donor. A suspicion of fraud began to form in his mind.\n\nHe decided to post about it. He didn't cite any real sources; he just used colloquial language and secondhand gossip to implicate the university president. He claimed the funds meant for prehistoric research and an archeological dig were being used to manufacture fluorescent cosmetics and fund a weird quantum microchip project, treating the whole thing like a massive conspiracy. He suggested they were trying to clone humans, use acid to dissolve evidence, and build a hydrogen bomb. He added an aggressive caption, ready to combat any foe who disagreed.\n\nThe post was a comet of chaos, leaving a crater of debris in its wake. It had the power to precipitate a catastrophe. Within a phase of a few hours, the post began to spiral out of control. The university auditorium was soon filled with a furious corps of fellow students, demanding amnesty for whistleblowers. The courtyard became an arena of protest, complete with angry graffiti on the sacred walls of the old estate. Julian felt his brief reign as a hero ending abruptly.\n\nJulian was astounded. He had expected a few likes, maybe a nick to his ego if it failed, but not this astronomical reaction. The gulf between his dumb prank and the reality of the situation was terrifying. A stab of guilt hit him. He felt himself falling down a dark shaft of despair. His guardian, a strict attorney, had to step in. \"This is not a game, Julian. You could face a lawsuit. The university can terminate your enrollment and demand you pay back your tuition.\"\n\nThe administration brought in a neutral referee to investigate the claims and acted accordingly. They decided to designate an expert to evaluate the aggregate data. The investigation revealed no fraud; the funds were just allocated in a complex circuit to offset costs, a legal mechanism to minimize taxes. There was no secret clone project, no weird hydrogen or acid experiments, no biotechnology meant to manipulate metabolism, cure diabetes, and lower cholesterol using nectar from a rare plant. It was all a deceptive illusion born of social media, and people reacted with disgust.\n\nJulian felt a deep despair. He had acted out of a distorted desire for attention, treating his followers like intimate kin. His actions had a severe context. He tried to dash out an apology where the main theme was taking responsibility, but the internet was immune to his excuses, like an antibiotic failing to clear an infection. People were quick to attribute malice to his actions, and he felt a sharp pinch of regret.\n\nTo avoid a lawsuit, Julian's attorney negotiated a coalition with the administration. Julian would have to do community service at the local dock, helping to grease the gears of old ships and clear away rust. He also had to participate as a participant in an explicit program to eliminate his social media dependency. He was stripped of his smartphone and given an equivalent device with no apps, just a slot for a basic SIM card.\n\nDuring his service, he worked under the fore of an old sailor who taught him about the breadth and circumference of the real world. He learned to tie a proper knot and knit a warm scarf, a calming ritual that grounded him. He realized that a simple atom of truth was worth more than an astronomical amount of likes. He learned to appreciate the complement of a quiet evening, the beauty of a crescent moon, and the importance of genuine connection.\n\nSocial media had been a parachute that failed to open, sending him plunging into a world of trouble. Now, he was slowly rebuilding. He had to refine his character, restrict his impulses, and embrace a life free of the constant need to embed himself in the digital sphere, no longer prone to such mistakes.\n", "Once upon a time in a school district on the brink of becoming completely bankrupt, an arrogant executive named Mr. Vance ruled with an iron fist. The status of education was in a state of gloom. The curriculum was a rigid artifact, a primitive fossil from a previous era. The classrooms were solitary confinement cells, gigantic rooms lacking any aesthetic appeal, where students were forced to conform to arbitrary rules or face being an outcast they would expel.\n\nDr. Aris, a sociable and talkative pioneer of dynamic teaching, sought to revive the system. He proposed an epic transition, breaking away from the typical educational convention to merge different subjects. He presented a preview of his forthcoming autobiography, which contained an excerpt detailing his vision for Education Reforms.\n\n\"The ultimate goal,\" Aris said, addressing the school board on behalf of the personnel and students, \"is to adapt and improve. We need a compromise between old and new, an authentic hybrid model whereby students can thrive.\"\n\nThe school building itself needed an overhaul too. The landlord, a nasty crook who held the lease and a massive mortgage, had neglected the plumbing and utility bills. The hygiene standards were so poor they couldn't be considered hygienic; a sticky residue covered the floors, and a termite infestation was eating every twig of the wooden structures. A fragile antique desk was all that remained of the original furniture. Aris planned to mend the facility, furnish it with trendy desks, and insulate the walls against the winter shiver caused by a nearby glacier. He also aimed to secure philanthropy to pay off the building's debt, ensuring the school wasn't treated like a mere tenant.\n\nAris proposed replacing mandatory standardized tests\u2014a burden that would often overwhelm students with an overload of internal stress\u2014with relevant, real-world projects. He wanted to employ new teachers, treating every applicant with gracious respect, to recruit those who understood the spectrum of student needs. He would register them for a chronology of training sessions to help them perceive the enigma of adolescent biological and cellular development.\n\nOne of his ideas was a hands-on science class where students could study heredity using a real orangutan or observe a reptile in a giant aquarium. They would learn about the primate lineage without relying on a stereotype or bias. He envisioned an outdoor trail leading to a canyon and a creek, where students could study nature. There, they wouldn't just read about a tusk or a wild animal; they would roam the environment, experiencing the globe firsthand.\n\nHowever, Vance considered these reforms a fantasy. \"This isn't a welfare program,\" Vance would humiliate Aris during meetings. \"We can't substitute hard work with a walk on a trail or a loaf of bread. The norm must precede your radical ideas.\"\n\nBut Aris didn't let Vance's incline toward negativity stall his efforts. Aris's perception was that Vance was just a tramp of the old guard, a lonely monarch clinging to his majesty. Aris, acting as a diplomat, brought in a respected surgeon to speak about therapy and the longevity of the human brain under proper educational stimulation. The surgeon explained how the sequence of learning could transplant old habits with new, healthy ones, just as one might transfer a healthy organ to a recipient.\n\nAris also brought in an oracle of educational renown, a woman who seemed to have supernatural wisdom. She spoke of how students should not be forced into an orbit around a strict curriculum, like planets in a galaxy bound by gravity, but should be allowed to explore the full sphere of human knowledge. She emphasized that every fragment of information could radiate meaning if taught with innocence and curiosity.\n\nTo fund his reforms, Aris had to secure new currency. He organized a reunion of successful alumni. The event featured a lyric performance and a showcase of student craft. Aris offered a refund to any donor who felt their money wasn't making at least a minimal impact. He managed to tow the community along, building a horizontal power structure rather than a top-down one.\n\nIn the end, Vance tried to delay the vote, but his attempts were a mere flap of a bird's wings against a storm. Aris's comprehensive overview of the reforms proved undeniable. The school board approved the plan. Aris was able to rig a new system of moderate assessments. The issues of fatigue and boredom that used to recur were effectively solved.\n\nAris wanted to provide an environment where learning was a joyful rite of passage, not a chore. He instructed teachers to take inventory of their students' passions, thereby ensuring that no student felt compelled to retreat inward. A quiet hum of focused energy replaced the previous chaos. \n\nInstead of having doctors prescribe medication for restless students, teachers would guide them to their respective areas of intrigue, encouraging them to probe deep into their interests. Even if a naughty student were to misplace their assignment, the system was designed to help them recover, so long as they remained punctual in their commitment to learning.\n\nThe school became a beacon, a place of learning where students didn't just drill facts but truly grew. It was the ultimate victory for an extension of educational reforms, proving that even the most broken system could be mended.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        let currentFontSize = 1.15;
        window.changeFontSize = function(direction) {
            currentFontSize += direction;
            if (currentFontSize < 0.8) currentFontSize = 0.8;
            if (currentFontSize > 3.0) currentFontSize = 3.0;
            const containers = document.querySelectorAll('.story-container');
            containers.forEach(c => {
                c.style.fontSize = currentFontSize + 'em';
            });
        };

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const data = allVocab[word.toLowerCase()];
                
                if (data) {
                    const display = document.getElementById('meaning-display');
                    
                    const checks = document.querySelectorAll('.check-item');
                    checks.forEach(c => {
                        if (c.textContent.trim().toLowerCase() === word.toLowerCase()) {
                            c.classList.add('check-used');
                        }
                    });

                    let defsHtml = '';
                    if (data.definitions && data.definitions.length > 0) {
                        data.definitions.forEach((def, index) => {
                            let posText = def.pos ? def.pos : 'Từ loại đang cập nhật';
                            let contextHtml = def.context ? `<div class="m-context">💡 <strong>Cách dùng ${index+1}:</strong> ${def.context}</div>` : '';
                            let exampleHtml = def.example ? `<div class="m-example">📖 <strong>Ví dụ:</strong> "${def.example}"</div>` : '';
                            
                            defsHtml += `
                                <div style="margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px;">
                                    <span class="m-type" style="margin-bottom:5px; display:inline-block;">${posText}</span>
                                    ${contextHtml}
                                    ${exampleHtml}
                                </div>
                            `;
                        });
                    } else {
                        defsHtml = `<div class="m-loading" style="margin-top: 10px;">(Dữ liệu đa nghĩa đang chờ cập nhật...)</div>`;
                    }

                    display.innerHTML = `
                        <div class="m-header">
                            <span class="m-word-title">${word}</span>
                        </div>
                        <div class="m-meaning">Nghĩa: ${data.meaning}</div>
                        ${defsHtml}
                    `;
                    display.style.display = 'flex';
                    
                    const rect = e.target.getBoundingClientRect();
                    let topPos = rect.bottom + window.scrollY + 8;
                    let leftPos = rect.left + window.scrollX;
                    
                    if (leftPos + display.offsetWidth > window.innerWidth + window.scrollX - 20) {
                        leftPos = window.innerWidth + window.scrollX - display.offsetWidth - 20;
                    }
                    if (leftPos < window.scrollX + 10) leftPos = window.scrollX + 10;
                    
                    display.style.top = topPos + 'px';
                    display.style.left = leftPos + 'px';
                    display.style.transform = 'none';
                    
                    const audio = document.getElementById('audio-player');
                    if (data.audio) {
                        audio.src = 'media/' + data.audio;
                        audio.play().catch(e => console.log('Audio error:', e));
                    }

                    if (window.meaningTimeout) clearTimeout(window.meaningTimeout);
                    window.meaningTimeout = setTimeout(() => {
                        display.style.display = 'none';
                    }, 12000);
                }
            }
        });

        // Click outside to hide
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.vocab-word') && !e.target.closest('#meaning-display')) {
                const display = document.getElementById('meaning-display');
                if (display) display.style.display = 'none';
            }
        });
</script>
