    <style>
        /* ===== PREMIUM DARK MODE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;

            height: 56px;
            border-radius: 50%;
            border: none;

            background: linear-gradient(145deg, #e6e9ef, #ffffff);

            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {

        }
        .theme-toggle:active { transform: scale(0.92); }

        /* ----- Transition for all elements ----- */
        body, body *, body *::before, body *::after {

        }

        /* ----- DARK MODE body ----- */

            background-color: #0f0f1a;

        /* Toggle button in dark */
        body.dark-mode .theme-toggle {

            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: none;
        }

        body.dark-mode .vocab-word {
            background: rgba(99, 102, 241, 0.15);

            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(129, 140, 248, 0.35);

        body.dark-mode .vocab-word:hover {

        body.dark-mode a.back-btn {
            color: #818cf8;

        body.dark-mode a.back-btn:hover { color: #a5b4fc; }

        body.dark-mode button {

    <style>
        /* ===== TRANSLATE POPUP ===== */
        .translate-popup {
            position: absolute;
            display: none;
            z-index: 1002;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }
        .translate-popup:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .translate-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #6366f1;
        }
        body.dark-mode .translate-popup {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        }
        body.dark-mode .translate-popup:hover {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        body.dark-mode .translate-popup::after {
            border-top-color: #8b5cf6;
        }

    
        /* Extra styles for meaning popup */

            font-style: italic;
        }

</style>

    <script>
        const allVocab = {"alleviate": {"meaning": "làm nhẹ bớt, làm dịu, làm khuây khỏa", "audio": "4000B6_alleviate.mp3", "definitions": [{"pos": "Động từ", "context": "Dùng để chỉ việc làm giảm bớt sự đau đớn, khó khăn hoặc một vấn đề tiêu cực.", "example": "The medication will help to alleviate the pain."}]}, "astrology": {"meaning": "thiên văn học, thuật chiêm tinh", "audio": "4000B6_astrology.mp3", "definitions": [{"pos": "Danh từ", "context": "Thuật chiêm tinh, nghiên cứu sự chuyển động của các vì sao để tiên đoán tương lai hoặc tính cách con người.", "example": "Many people read their horoscopes, but few take astrology seriously."}]}, "differentiate": {"meaning": "phân biệt", "audio": "4000B6_differentiate.mp3", "definitions": [{"pos": "Động từ", "context": "Phân biệt sự khác nhau giữa hai hay nhiều thứ.", "example": "It is important to differentiate between fact and opinion."}, {"pos": "Động từ", "context": "Trong toán học, tính đạo hàm.", "example": "We need to differentiate the function to find its minimum."}]}, "disrupt": {"meaning": "đập gãy, đập vỗ, phá vỡ", "audio": "4000B6_disrupt.mp3", "definitions": [{"pos": "Động từ", "context": "Làm gián đoạn, làm xáo trộn một quá trình, sự kiện hoặc hệ thống.", "example": "The heavy rain will disrupt the transportation system."}, {"pos": "Động từ", "context": "Thay đổi cấu trúc cốt lõi của một ngành công nghiệp bằng công nghệ mới.", "example": "The startup aims to disrupt the traditional banking industry."}]}, "equation": {"meaning": "sự làm cân bằng", "audio": "4000B6_equation.mp3", "definitions": [{"pos": "Danh từ", "context": "Phương trình trong toán học.", "example": "He solved the quadratic equation easily."}, {"pos": "Danh từ", "context": "Sự cân bằng, sự đồng nhất giữa các yếu tố trong một tình huống phức tạp.", "example": "Money is not the only part of the equation when choosing a job."}]}, "err": {"meaning": "lầm lỗi, sai lầm", "audio": "4000B6_err.mp3", "definitions": [{"pos": "Động từ", "context": "Phạm sai lầm, lầm lỗi.", "example": "To err is human, to forgive divine."}]}, "erroneous": {"meaning": "sai lầm, sai sót; không đúng", "audio": "4000B6_erroneous.mp3", "definitions": [{"pos": "Tính từ", "context": "Sai lầm, không chính xác dựa trên thông tin sai lệch.", "example": "The report was based on erroneous data."}]}, "frantic": {"meaning": "điên cuồng, điên rồ", "audio": "4000B6_frantic.mp3", "definitions": [{"pos": "Tính từ", "context": "Điên cuồng, rối rít vì lo lắng hoặc sợ hãi.", "example": "She was frantic with worry when her child went missing."}, {"pos": "Tính từ", "context": "Rất vội vã, náo nhiệt.", "example": "They made a frantic attempt to finish the project on time."}]}, "hull": {"meaning": "vỏ, bao,vỏ trái cây", "audio": "4000B6_hull.mp3", "definitions": [{"pos": "Danh từ", "context": "Thân tàu thủy.", "example": "The hull of the ship was damaged in the storm."}, {"pos": "Danh từ", "context": "Vỏ của các loại hạt hoặc trái cây.", "example": "We need to remove the hulls of the strawberries."}]}, "inadvertent": {"meaning": "vô ý, không chú ý; thiếu thận trọng", "audio": "4000B6_inadvertent.mp3", "definitions": [{"pos": "Tính từ", "context": "Vô ý, không cố ý (hành động).", "example": "An inadvertent error caused the system to crash."}]}, "improvise": {"meaning": "ứng khẩu,ứng biến", "audio": "4000B6_improvise.mp3", "definitions": [{"pos": "Động từ", "context": "Ứng biến, làm mà không có sự chuẩn bị trước.", "example": "He forgot his lines and had to improvise."}, {"pos": "Động từ", "context": "Chế tạo hoặc làm ra từ những nguyên liệu sẵn có.", "example": "We had to improvise a shelter out of branches and leaves."}]}, "latitude": {"meaning": "vĩ độ, vĩ tuyến", "audio": "4000B6_latitude.mp3", "definitions": [{"pos": "Danh từ", "context": "Vĩ độ, vị trí địa lý.", "example": "The city is located at a latitude of 40 degrees North."}, {"pos": "Danh từ", "context": "Sự tự do, quyền lựa chọn trong hành động.", "example": "The boss gives me a lot of latitud         const baseStories = ["The philosophy of life is not a simple equation. It is a volatile mix of intrinsic truths and absurd paradoxes. Elias, once a reputable aristocrat of the local aristocracy, now lived in a sparse attic overlooking a congested city. The din of civic life below did not disrupt his peace; rather, it served to soothe his once frantic ego. He had learned that to err is human, and holding onto vanity only serves to deform the soul.\n\nIn his youth, he would vie for power, wearing exclusive attire adorned with a hallmark of his lineage, a predominant symbol of an era devoid of humility. He followed every craze, observing a strict, yet dubious etiquette. His feminine counterpart, a woman who wore too much rouge and an ornate strap on her garment, shared his love for excess. They were the epitome of vulgar wealth, throwing gourmet feasts that would dissatisfy the starving multitude on the periphery. To alleviate his guilt, he would publicize his fictitious charities in the local gazette, an outright deception meant to gratify his ego rather than fend off the strife of the poor. He was liable for much distress, often using an erroneous persuasion to negotiate his way out of a particular ordeal.\n\nBut life has a way to plunge one into reality. An unexpected bout of pneumonia, compounded by anemia and arthritis, left him with a jagged, skeletal posture. He could not conceive how this happened. He suffered an inadvertent overdose of a therapeutic mash made from sesame and pungent herbs, intended to cure his insomnia. As he would gasp for air on the verge of death, an apologetic courier arrived to relay news of his deceased brother's freight business collapsing. A lot of fuss and chaos would ensue. This sudden loss served to clarify his vision. He realized that wealth could not prolong life, signify true worth, or buy permanence.\n\nHe left the ministry where he worked, exhausted by overwork, shedding his old life like an embryo breaking from its mold. He became a mariner, seeking latitude on the open seas, hoping to attain wisdom. The hull of his ship was his new altar. He faced vicious storms that would obstruct his path, and dogged winds that tested his elastic spirit. Once, his ship washed ashore, and he found himself stranded on a terrestrial island. With no tools, he had to improvise and excavate the earth with a makeshift shovel to find a chunk of edible root. He had to use dung for a fire to char fish, relying on intuitive survival skills he didn't know he possessed. \n\nIn this isolated locale, botany became his new passion. He would theorize about the homogeneous nature of life, trying to decipher the secrets of the plants. It was an arduous endeavor, but it helped him hone his understanding of existence. He realized that life does not revolve around oneself, but is a vast web where we all must coexist.\n\nReturning to civilization years later, he was a changed man. The outspoken superintendent of his building found him benign, a stark contrast to the psychotic, sinister rumors that had circulated about his descent into madness. Some even claimed he had psychic powers to elude death. Elias was no longer wary of the world; his reluctance to engage had vanished. He would sip tea from an old kettle at dusk, listening to the superintendent snore soundly next door, finding a comforting rhythm in the mundane.\n\nHe would often restate his philosophy: \"Life is a multitude of choices. We diverge and alternate between good and bad. Our actions engrave our legacy on the universe. Do not let excess tangle your mind. Differentiate between what is credible and what is a deceptive nuisance.\"\n\nHe would pad around his room, surrounded by surplus books on astrology and philosophy. He sought to enlarge his scope of understanding. Even when his mind would waver, a vigorous sip of tea would ground him. He refused to contradict his core beliefs or let the past dictate his future. Hence, he had found a way to plaster over the cracks of his past, not with vanity, but with genuine remorse. He was a mariner of life, navigating the waters with a steady hand, making sure to verify his actions against his conscience.\n", "The sky was overcast, an ominous omen as Elias took the tram to the gallery. Elias, a critic of high privilege and refined upbringing, did not usually socialize in such dilapidated districts. The building, a former timber mill, was now the frontier of modern art. He was a vocal advocate for the mainstream, but felt it imperative to adhere to his vow to explore new cultural dynamics.\n\nAt the onset, he was hesitant. Inside, the gallery was overcrowded. A feeling of unrest seemed to permeate the crowd. To evade the crush and keep his sanity intact, Elias had to walk sideways. The exhibition, organized by a radical federation of progressive artists, aimed to unsettle. The artists tended to obsess over negligible details, often going overboard with their messages to propel their careers and ensure their views prevail. They liked to seclude themselves from traditional art, striving instead to warp reality into something unrecognizable.\n\nThe first piece was a massive apparatus resembling the intestines of some beast, complete with a leaky valve that let gross fluid accumulate on the floor. A plaque dared to disclose that the artist sought to magnify the deterioration of urban life. Elias broke out in a rash of annoyance. The fluid seemed to contaminate the sterile air, creating a hazard that the poor housekeeping staff had to counteract. Not a speck of dust was permitted elsewhere, but this filth was considered a premium masterpiece. Someone in a bizarre outfit was giving a voluntary performance, pretending to forage for a stray lentil in a mound of rubble. It was supposed to evoke the struggles of the needy, but the display was frankly intolerable.\n\nNearby, a civilian in a lush coat tried to suppress a grin. The atmosphere oscillated between a festive, jolly euphoria and a sober mood. Viewers were forced to quietly contemplate the art. In another corner, a video projection showed an aerial view of an avalanche sweeping away a solitary cot. The piece claimed to manifest the fragile consistency of mortal existence, how easily life\u2019s safety net could rupture.\n\nElias walked past a splendid canvas that used camouflage to hide a smallpox microbe\u2014a poignant reminder of a historical epidemic. The artist's goal was to render the invisible visible, highlighting how a deficiency in humane provision can transmit disaster and act like a savage pest. It made Elias's respiration quicken. He felt a temporary paralysis, expecting it to stun the audience. It was a testament to the fact that disease and suffering remain inseparable companions to humanity, an elusive enemy that can easily induce panic if we do not curb our hubris.\n\nA practitioner of performance art began to sob loudly nearby, a staged discharge of emotion. They claimed the modern world was an invalid system that only benefited those who could authorize conquest and turn genuine expression into a mere commodity. They called upon the senate to enact laws that prohibit such practices. It sounded more like a prophecy of doom than art, delivered by a self-appointed sage holding a handbook of revolution. They seemed envious of true talent, trying to enlist support through guilt.\n\nElias felt weary, his mind growing numb. He sat on a small stool, trying to counteract a muscle cramp. The damp cold of the gallery seemed to seep into his very marrow. He was susceptible to the metabolic strain of trying to compile his thoughts and diagnose the sentiment of this art. He had to marshal his energy to replenish his morale and maintain his vigil over his critical faculties.\n\nHe watched a patron try to enroll in the artist's circle, bringing a substantial donation. The artist began to collaborate on a new piece, using a torch to melt a slate of ice, demonstrating convection. Water dripped from a broken faucet, threatening to impede the flow of an artificial artery on the floor, while someone acting like a dutiful butler tried to administer clean-up efforts.\n\nElias couldn't contend with the sheer volume of metaphors created to adorn the space. Was this art viable? It felt like a reckless plunge into a vast tract of nonsense, a substantial flaw in the paramount purpose of art.\n\nDeciding to bid farewell, he refused to certify this madness. Outside, he saw a park ranger gently petting a stray dog's paw, a deeply compassionate scene. Elias felt a quiver of true bliss. This was life. He made a pledge to upgrade the standards of his critique.\n", "Once there was a vivacious billionaire who wanted to amend the global economy. Amid a frigid blizzard that brought temperatures below zero centigrade, he decided to launch an ambitious, ingenious plan at his grand manor. The exterior of the manor, looking like an outmoded monastery with a winding driveway, was actually a hub of innovative technology, an absolute novelty. He called his plan the \"Phoenix Charter,\" hoping it would spur an almighty economic rebirth.\n\nBeforehand, backstage before the grand session, the billionaire met with his mentor, an infamous economist.\n\"We must not underestimate the adverse dependency on fossil fuels,\" the mentor said with earnest tact. \"To stimulate the market, we must disseminate definitive solutions and abolish our outmoded constitution and any laws that pertain to it.\" They wanted to tackle the dreary problem of the eternal boom and bust cycles that fluctuate to and fro. To reverse the trends that continue to deteriorate, they proposed an inclusive, cosmopolitan system.\n\nHowever, the advent of this plan was met with an uproar. The legislature of a monolingual, imperial nation feared it would undermine their nationality. A patriot group, acting like a brute mob, threatened to prosecute the billionaire, claiming the plan was a clumsy excuse to segregate resources. \"They want to delete our sovereignty!\" they began to chatter. The chatter filled the air. Some believed it was a pathological attempt to exclude certain ethnic and racial groups.\n\n\"We must not censor their primal outburst,\" the billionaire told his staff, extending an outstretched hand in a gesture of solidarity. \"We must show them firsthand the inclusion and courtesy our system offers, a true concentric model where benefits radiate clockwise.\"\n\nMeanwhile, a team of scientists in an underground cavity worked to simulate a new propulsion system based on electromagnetic electron transfer. This innovation would accelerate trade. They used a definitive lunar model to equate the forces, hoping the propulsion could glide goods across the airway at phenomenal speeds. They believed the goods could zip across the globe faster than any freeway. Meteorological experts, versed in meteorology, studied the crisp skies to predict if adverse weather would impede the launch anew. A sudden defect in the adhesive used on a shipping parcel proved to be a flammable culprit, threatening to halt progress. The crew had to evacuate the lab to avoid a premature disaster, escaping the tumult.\n\nThe billionaire had to testify before a solemn committee under intense scrutiny. \"It is not a satire,\" he declared in fluent French, keeping a dignified profile. \"We aspire to allocate resources fairly, like an appetizing feast. We will not flatter the rich nor limp away like a coward or a lame dog. We will not let our ideals collide with greed.\"\n\nHis tenacious speech tried to invoke a sense of shared purpose, a constellation of hope. He explained that just as photosynthesis needs sunlight and pollen needs bees, a vibrant economy requires the free flow of ideas to grow, much like a sapling in a nursery. \"We must condense our efforts to regain trust,\" he urged, showing no remorse for his ambitious vision. He refused to personalize the attacks or yield to the discord. Many began to resent his wealth, but he stood firm.\n\nBut a sudden intermittent seizure of the market caused a sharp plunge. Experts in psychiatry conducted a psychiatric evaluation of the market's irrational behavior, suggesting a deep-seated dependency on old ways, a reflex to panic. A swarm of reporters gathered. The billionaire watched the ticker dump stocks, feeling a tickle of anxiety. The texture of the economy was changing, shifting from intermediate stability to outright chaos.\n\nTo calm the panic, he hosted a hearty reception in a hospitable cove near the manor. He played a soothing concerto on the piano, trying to induce a trance among the investors. \"We must not let secrecy or linguistic barriers divide us,\" he said, handing out delicious food with a silver utensil. He asked them to inhale deeply, to find their center.\n\nEventually, the poll numbers began to rise anew. The innovative electromagnetic system managed to penetrate the market, and duplicate early successes. The global economy, once a subject of dreary despair, began to soar again like a phoenix, proving that with ingenious innovation and inclusive solidarity, even the most deeply rooted problems could be tackled.\n", "The Festival of the Globe\n\nIt was the grandest multicultural festival of the decade, known to synthesize traditions from every sector of the world into a massive, fluid interchange of art and humanity. It was meant to be an immersive sensory experience, an event to generate goodwill and justify unity amidst concerns of overpopulation and tyranny.\n\nOrganized by an industrious columnist and a veteran advocacy group, the festival aimed to replicate the hospitality of diverse nations. They managed to assemble the event on a massive hectare of adjoining pasture and turf near a metropolitan reservoir, complete with a terrace overlooking the delta. A grand arch made of granite and moss was built to stand erect as the main entrance, and volunteers took time to renovate an old gazebo on the grounds.\n\nTo fulfill the event's goals, the committee had to revise many plans. The sheer bulk of the exhibits threatened to overwhelm the space. They had to cram everything into the venue, utilizing a shortcut analogous to an intricate maze. They hired a courteous janitor crew, who used liberal amounts of detergent to ensure no foul odors or omission of cleanliness would penalize the experience. Even the locker depot, built on a gravel slab near a replica of an ancient mansion, was kept immaculate.\n\nIn the culinary sector, chefs worked with fragrant seasoning, vinegar, sodium, and charcoal to create dishes that would outnumber any casual feast. One staple dish was an export from the outback, cooked over amber coals that gave off a pleasant fume rather than the harsh smoke of petroleum. Another stall featured a synthesis of mandarin and regional cuisines, where a prototype device shaped like a funnel was used to invert and mix ingredients. The output was a savory paste, a conversion of raw goods into a masterpiece. Even the bitter vine leaves and seasoned ore-like chunks of dried meat were a hit. Patrons would subsist on these delicacies, proving the inherent value of culinary art. A misguided attempt to emulate a vampire-themed dish with red syrup that looked like moist saliva or spit drew sarcastic scorn from a food critic, but the overjoyed crowds didn't seem to mind. \"Nope,\" said a tolerant local, wiping a streak of sauce from his chin, \"it takes guts to try it.\"\n\nThe entertainment was equally inventive. A habitual acrobat would rehearse her wavy movements, her stunt work so graceful she seemed to defy the statute of gravity. A hereditary earl from Europe and a local deputy presented an analogy about ancestry, their voices rising to harmonize in a traditional hymn. An archer showcased her skills, aiming to pierce a tiny target resembling a cricket on a distant pebble. The procession included actors who would depict a historical tyrant demanding a ransom from his prey, a story where the villain was eventually defeated. A prophet character stood by a pier, declaring that the warmth of the day\u2014measured on a thermometer in fahrenheit\u2014was a sign of good fortune. Though the weather had been glacial just weeks prior, the sudden shift was a paradox that seemed to heighten the festival's magic. The sun's rays would tilt through a grove of trees, casting shadows over a replica tent.\n\nHowever, behind the scenes, some allege that a conspiracy threatened to constrain the festival. Rumors surfaced of a plot to suspend the event, citing an obscure tariff on imported goods and a judicial petition to scrap the whole thing due to a perceived casualty risk from a tall structure. The organizers refused to defer. They knew their credentials would outweigh any false claims. They had to prod local officials, who tried to intimidate them. \"We abide by the rules,\" the columnist declared, pointing a forefinger. \"Do not try to restrain us.\" They refused to subscribe to the idea that their multicultural dream would expire. They proved their safety measures were sound, ensuring not a single casualty. They held the patent on perseverance.\n\nAt dusk, the festival's dual nature became apparent. What started as an energetic sprint of daytime activities transitioned into a communal evening of reflection. People who had seemed to comprise different worlds now found common ground. A man with binoculars scanned the whereabouts of his family, only to find them laughing with foreign visitors. A child tried to mimic the call of an exotic bird, giving it a playful peck on a wooden statue. To avoid any euphemism, the organizers stated plainly: this festival was a beacon of hope. They had an oversight group oversee the final cleanup. It proved that despite our differences, and vice versa, humanity could unite. As the final notes of a concert rang out, not a single yawn was seen. The festival would haunt the memories of all who attended, a beautiful reminder of our shared world.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>

    <script>
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const data = allVocab[word.toLowerCase()];
                
                if (data) {
                    const display = document.getElementById('meaning-display');
                    
                    const checks = document.querySelectorAll('.check-item');
                    checks.forEach(c => {
                        if (c.textContent.trim().toLowerCase() === word.toLowerCase()) {
                            c.classList.add('check-used');
                        }
                    });

                    let defsHtml = '';
                    if (data.definitions && data.definitions.length > 0) {
                        data.definitions.forEach((def, index) => {
                            let posText = def.pos ? def.pos : 'Từ loại đang cập nhật';
                            let contextHtml = def.context ? `<div class="m-context">💡 <strong>Cách dùng ${index+1}:</strong> ${def.context}</div>` : '';
                            let exampleHtml = def.example ? `<div class="m-example">📖 <strong>Ví dụ:</strong> "${def.example}"</div>` : '';
                            
                            defsHtml += `
                                <div style="margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px;">
                                    <span class="m-type" style="margin-bottom:5px; display:inline-block;">${posText}</span>
                                    ${contextHtml}
                                    ${exampleHtml}
                                </div>
                            `;
                        });
                    } else {
                        defsHtml = `<div class="m-loading" style="margin-top: 10px;">(Dữ liệu đa nghĩa đang chờ cập nhật...)</div>`;
                    }

                    display.innerHTML = `
                        <div class="m-header">
                            <span class="m-word-title">${word}</span>
                        </div>
                        <div class="m-meaning">Nghĩa: ${data.meaning}</div>
                        ${defsHtml}
                    `;
                    display.style.display = 'flex';
                    
                    const audio = document.getElementById('audio-player');
                    if (data.audio) {
                        audio.src = 'media/' + data.audio;
                        audio.play().catch(e => console.log('Audio error:', e));
                    }

                    if (window.meaningTimeout) clearTimeout(window.meaningTimeout);
                    window.meaningTimeout = setTimeout(() => {
                        display.style.display = 'none';
                    }, 12000);
                }
            }
        });

        // Click outside to hide
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.vocab-word') && !e.target.closest('#meaning-display')) {
                const display = document.getElementById('meaning-display');
                if (display) display.style.display = 'none';
            }
        });
</script>
