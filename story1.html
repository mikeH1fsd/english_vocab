    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.8; padding: 20px; max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        button { padding: 8px 16px; font-size: 1.05em; cursor: pointer; border: none; border-radius: 5px; background-color: #3498db; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button.active { background-color: #e67e22; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
        .story-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1.15em; display: none; }
        .story-container.active { display: block; }
        h2 { color: #34495e; border-bottom: 2px solid #bdc3c7; padding-bottom: 10px; margin-top: 20px; }
        .vocab-word { background-color: #ffeaa7; padding: 2px 5px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #d35400; transition: background-color 0.3s; }
        .vocab-word:hover { background-color: #fdcb6e; }
        #meaning-display { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2d3436; color: white; padding: 15px 30px; border-radius: 8px; font-size: 1.2em; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: none; z-index: 1000; text-align: center; max-width: 80%; }
        .meaning-word { color: #fdcb6e; font-weight: bold; text-transform: capitalize; }
        .stats, .checklist-container { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .check-item { padding: 5px 10px; border-radius: 4px; font-size: 0.85em; border: 1px solid #ddd; }
        .check-used { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        p { margin-bottom: 15px; }
    </style>

    <style>
        /* ===== PREMIUM DARK MODE ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #e6e9ef, #ffffff);
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -2px -2px 8px rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
            box-shadow: 6px 6px 15px rgba(0,0,0,0.15), -3px -3px 10px rgba(255,255,255,0.9);
        }
        .theme-toggle:active { transform: scale(0.92); }

        /* ----- Transition for all elements ----- */
        body, body *, body *::before, body *::after {
            transition: background-color 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease;
        }

        /* ----- DARK MODE body ----- */
        body.dark-mode {
            background-color: #0f0f1a;
            color: #d4d4e0;
        }

        /* Toggle button in dark */
        body.dark-mode .theme-toggle {
            background: linear-gradient(145deg, #1e1e30, #2a2a44);
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5), -2px -2px 8px rgba(60,60,90,0.2);
        }

        /* ----- Story pages ----- */
        body.dark-mode .story-container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: #d4d4e0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        body.dark-mode h1 {
            background: linear-gradient(135deg, #667eea, #764ba2) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        body.dark-mode h2 {
            color: #a78bfa;
            border-bottom: 2px solid rgba(167, 139, 250, 0.2);
        }

        body.dark-mode h3 { color: #c4b5fd; }

        body.dark-mode .stats,
        body.dark-mode .checklist-container {
            background: rgba(30, 30, 50, 0.8);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
        }

        body.dark-mode .check-item {
            border: 1px solid rgba(255,255,255,0.08);
            color: #888;
            border-radius: 6px;
        }

        body.dark-mode .check-used {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.25);
            box-shadow: none;
        }

        body.dark-mode .vocab-word {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            border-bottom: 1.5px solid rgba(129, 140, 248, 0.35);
            box-shadow: none;
            text-shadow: none;
        }
        body.dark-mode .vocab-word:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #c7d2fe;
            border-bottom-color: rgba(165, 180, 252, 0.5);
            box-shadow: none;
            transform: none;
        }

        body.dark-mode a.back-btn {
            color: #818cf8;
        }
        body.dark-mode a.back-btn:hover { color: #a5b4fc; }

        body.dark-mode button {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }
        body.dark-mode button:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }
        body.dark-mode button.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
        }

        body.dark-mode #meaning-display {
            background: linear-gradient(145deg, #1e1e30, #2a2a44);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        body.dark-mode p { color: #b0b0c0; line-height: 2; }
        body.dark-mode .story-container { font-size: 1.1em; letter-spacing: 0.01em; }

        /* ----- Index / Hub page ----- */
        body.dark-mode .card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        body.dark-mode .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.15);
            transform: translateY(-8px);
        }
        body.dark-mode .card::before {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        body.dark-mode .card h2 { color: #818cf8; }
        body.dark-mode .card p { color: #9ca3af; }
        body.dark-mode .btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
        }
        body.dark-mode .card:hover .btn {
            background: linear-gradient(135deg, #6366f1, #818cf8) !important;
        }

        body.dark-mode .header p { color: #9ca3af; }

    </style>

    <style>
        /* ===== TRANSLATE POPUP ===== */
        .translate-popup {
            position: absolute;
            display: none;
            z-index: 1002;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-user-select: none;
        }
        .translate-popup:hover {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .translate-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid #6366f1;
        }
        body.dark-mode .translate-popup {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
        }
        body.dark-mode .translate-popup:hover {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        body.dark-mode .translate-popup::after {
            border-top-color: #8b5cf6;
        }

    
        /* Extra styles for meaning popup */
        #meaning-display {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            min-width: 300px;

        .m-header {

        }
        .m-type {
            font-size: 0.8em;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-style: italic;
        }
        .m-meaning {
            font-size: 1.1em;
            font-weight: bold;
        }
        .m-example {
            font-size: 0.95em;
            color: #e0e0e0;
            font-style: italic;
            border-left: 3px solid #fdcb6e;
            padding-left: 10px;
            margin-top: 5px;
        }
        .m-loading {
            font-size: 0.9em;
            color: #aaa;
            font-style: italic;
        }

</style>
</head>

    <script>
        const allVocab = {"afraid": {"meaning": "Sợ hãi", "audio": "4000B1_afraid.mp3", "definitions": [{"pos": "Tính từ", "context": "Cảm thấy sợ hãi, hoảng sợ trước một mối đe dọa hoặc nguy hiểm.", "example": "She is afraid of dogs."}, {"pos": "Tính từ", "context": "Dùng để diễn tả sự e ngại, hối tiếc một cách lịch sự khi phải báo tin không vui hoặc từ chối.", "example": "I am afraid I cannot come to the party."}]}, "agree": {"meaning": "Đồng ý", "audio": "4000B1_agree.mp3", "definitions": [{"pos": "Động từ", "context": "Đồng ý, có cùng quan điểm hoặc ý kiến với ai đó.", "example": "I completely agree with you on this issue."}, {"pos": "Động từ", "context": "Chấp thuận, bằng lòng làm việc gì đó.", "example": "They agreed to meet again next week."}]}, "angry": {"meaning": "Tức giận", "audio": "4000B1_angry.mp3", "definitions": [{"pos": "Tính từ", "context": "Cảm thấy hoặc thể hiện sự tức giận, bực bội.", "example": "He became very angry when he heard the news."}]}, "arrive": {"meaning": "Đến, tới nơi", "audio": "4000B1_arrive.mp3", "definitions": [{"pos": "Động từ", "context": "Đến một địa điểm, đích đến.", "example": "The train will arrive at the station at 8 AM."}, {"pos": "Động từ", "context": "Đi đến một quyết định, kết luận hoặc thỏa thuận (arrive at).", "example": "The jury has arrived at a verdict."}]}, "attack": {"meaning": "Tấn công", "audio": "4000B1_attack.mp3", "definitions": [{"pos": "Động từ / Danh từ", "context": "Hành động tấn công bằng vũ lực hoặc lời nói.", "example": "The army planned to attack the enemy camp at dawn."}, {"pos": "Danh từ", "context": "Cơn đau đột ngột do bệnh lý (như cơn đau tim, hen suyễn).", "example": "He suffered a massive heart attack."}]}, "bottom": {"meaning": "phần dưới cùng; đáy", "audio": "4000B1_bottom.mp3", "definitions": [{"pos": "Danh từ", "context": "Phần thấp nhất, dưới cùng hoặc đáy của một vật, một nơi.", "example": "The book is at the bottom of the pile."}, {"pos": "Danh từ", "context": "Bản chất, nguồn gốc hoặ         const baseStories = ["Living in a small village, I often take a stroll to the huge library to relax and find peace. As a student, my habit is to attend to my studies carefully, but today I faced a challenge: a final science project. I was aware that if I didn't solve the issue, I might fail my grade, which would be a terrible result. My frequent trips there were likely the only way to survive the semester. I was afraid of getting a badly written report, so I had to arrange my time well. I couldn't allow things to get worse. I tried to expect the best, but several things went wrong.\n\nI needed to create a chemical experiment in the laboratory. The smell was awful, making me nervous. My teacher, a famous expert in the field, would frequently instruct us to be patient and carefully approach any adventure in science. \"Do not let a sudden noise scare you,\" she would say, \"and avoid making an error that could harm anyone or hurt yourselves.\" It was a rare experience to feel so much pressure. It wasn't a normal day.\n\nThere was a clever student named Max among us. He would always agree to contribute his ideas. He was very friendly, not at all cruel or evil, but sometimes he played a trick on us. One time, he made a cloud of smoke appear out of nowhere. We heard a loud shout, and I thought a ghost or an alien from another planet in the universe had come to attack us! Instead, Max just let out a laugh. He had hidden at the bottom of a desk. \"Did I fright you?\" he asked. We were angry for a moment, but finally, we had to smile. We were a community, and none of us wanted to punish him.\n\nI had to continue my work. I had to describe the difference between two elements. I drew a chart to show the contrast. The condition was that we had to divide the workload. My partner was late. The distance from his home wasn't far, but the weather was poor. When he did arrive, he looked upset and his hands began to shake. He had a dead plant in his hand. We had to hide it. We couldn't let it ruin our chances. He made a request for help. He would announce his findings and claim that they were his own, but I had to follow his lead. \n\nTo get an advantage, we decided to represent our findings with a model. \"We can lay it right beside the beaker,\" my partner said. \"Do you comprehend?\" I asked. He gave a positive reply. We had to maintain a balance between theory and practice. The middle of the experiment was tricky, a real test of judgment. Suddenly, our liquid started bubbling. It was a wild reaction! We needed to rely on our familiar techniques. I kept the formula a secret because I wanted to protect our work. \n\nWe had to force ourselves to stay calm. \"Don't let the liquid spread,\" he warned. \"Or it could kill our chances.\" It was an individual choice to take this course, but we shared the concern. Sometimes I felt like a prince locked in a tower, forced to hunt for answers. I just wanted to escape and go home to my pet dog, where I usually reside, and where my things belong.\n\nBut since I made a promise to myself to do my best, I pushed forward. I had to accept the responsibility. We stood face to face with our creation. It was visible that we had put in a lot of effort. We began to roll the ball down the ramp. It hit the target. We were so pleased with the view. It made perfect sense.\n\n\"Did we do it?\" I asked, my voice filled with content.\n\n\"Yes,\" my partner answered. We would return home victorious.\n\nI suppose I learned that day that a student's life isn't just about trying to reach a goal; it's about the journey. You must encourage each other, behave in an appropriate way, and not let problems cause you to give up. You can't just grab success; you have to earn it. We watched the results hang on the board. We were safe. It was a wise decision to work together. And therefore, I will never forget this day, as long as I shall ever live.\n", "It was no longer necessary to remain alone in our thin apartment. The primary purpose of the weekend was to release emotion, spend some time together, and propose a pleasant picnic. We made the decision to sail to a separate island far across the ocean. We needed to prepare a great meal, perhaps collect a berry crop and feed our hunger. To be frank, we didn't want to risk any trouble or damage, or allow anything bad to happen, so we had to focus and prevent any silly mistake like forgetting to fix the sail.\n\nA local artist and professional coach volunteered to introduce us to a magical site near a forest. The journey would require an essential method: we had to step carefully and navigate against the wind. We were proud to discover a perfect spot on the ground where the grass was green. There was no need to compete or race; it was a fortunate opportunity to observe the whole scene. \n\nWe laid down a sheet as a structure for our rest. For example, the food didn't contain any bad material, and its quality and taste were extreme. We had to consume the meal before a certain creature, perhaps a bird with a long tail, would try to spot and steal it. We watched the wave pattern and saw the ocean function like a breathing cell. We didn't want anything to excite any fear, yet we began to wonder about the truth of our existence. We had a chance to breathe, and we couldn't control our joy.\n\nThe conversation turned serious when my neighbor began to read an article from a magazine. It was a novel written by a poet, with an outline about a lord who wanted to marry a lady. The story had a characteristic symbol: a single tear of blood that would burn. To compare, another friend read a description of a recent exam on technology, which had an immediate effect on his attitude. He felt responsible for his success and didn't want to limit his profit.\n\nWe walked along the length of the beach. We had to step carefully around a hole in the sand. Suddenly, we saw a strange shape. It was a letter in the mail, left under a rock. We had to identify the print. The message was a direct demand: we had to save the island from an increase in pollution. We couldn't be asleep anymore. We had to wake up and respond.\n\nIt felt like winning a prize. We could raise awareness. We realized that either we take a position and act, or the island would suffer. We didn't want to owe anything to future generations. We needed to protect this space and ensure that nature would still survive. The beautiful image of this site was important. \n\nThe benefit of our action would be equal for everyone. The theory was that every single effort would count. We wouldn't throw our chance away. We had to guard the environment and maintain a positive attitude. \n\nAs the sun began to set, the sight was beautiful. We sat on a stair carved into the rock, feeling the cool breeze. We didn't need to judge each other. We had the chance to fix a problem and make a difference. \n\nWe gathered our things from a small store of supplies. We didn't leave any trash behind. We were careful not to damage the area. We knew the correct way to behave. We had to respect the rules and protect the ecosystem. We were ready to face the challenge and direct our energy toward the next step.\n", "The Supermarket Operation\n\nIn the most bustling county of the state, an ancient supermarket named 'The Wealth of Groceries' stood near the bottom of a large hill. It wasn't a theater or a music academy, yet it managed to entertain every customer who walked through its flat entrance gate.\n\nA distinguished gentleman named Arthur, a retired police officer who had also worked as an international lawyer and ship captain during his long career, decided to explore the store. It was the peak holiday season, and Arthur\u2019s goal was to purchase the exact ingredients for a special dish he wanted to serve at a social dinner.\n\n\"I must not waste a single bit of time,\" he muttered, using a small wooden board as a clipboard to hold his original list. Whether anyone else was already there didn't bother him. He stepped carefully to avoid a small puddle near the carts. He felt truly alive and glad to be out.\n\nHis brain focused on the process. First, he walked toward the fresh produce. The vegetable aisles were a bright display of colors that seemed to indicate freshness. The store\u2019s policy was to offer an excellent product at a fair price. Arthur asked a helpful clerk to advise him on the best herbs.\n\n\"I highly recommend these,\" the clerk said. \"They are definitely worth the extra pound.\"\nArthur took a moment to consider the opinion, and then chose to select a few bunches. He wanted to treat himself to a nice meal, so he didn't mention his usual tight budget to anyone.\n\nNext on the course was the meat counter. Arthur needed a good cut, but absolutely no bone in it. He wanted a real center cut. A friendly staff member holding a sharp meat-cutting tool helped him locate the perfect item. He placed it in his cart, anticipating the moment he would set it on a plate at home.\n\nAs he moved forward, an actual mystery began to occur. Near the bakery, a thief tried to steal a pocket dictionary and a foreign candy bar, attempting to keep them hidden. The thief\u2019s behavior was erratic, showing signs of mental distress, and he tried to hide behind a stack of wood chips meant for BBQ smokers.\n\n\"Stop right there! That is the store's property!\" shouted a tall woman, a nurse who was an off-duty athlete. She wasn't going to let this injustice happen.\n\nThe thief looked ready to argue or even start a small war, but Arthur didn't doubt his own ability to defuse the situation. He didn't want the conflict to destroy the peaceful atmosphere. He made contact with the store manager and began to communicate a solution.\n\n\"Let us not beat around the bush,\" Arthur said, giving a polite but firm speech. \"I will charge these items to my card. This man clearly needs comfort, not a prison cell.\"\n\nThe thief seemed to amaze at this kindness. The response from the crowd was overwhelmingly positive. They began to gather and celebrate Arthur as a local hero. It was an unexpected match of compassion and tense drama.\n\n\"I refuse to accept any reward,\" Arthur said humbly, trying to lower the attention he was getting. \"I only did what any average person would do to manage a bad situation. We all depend on each other to exist peacefully.\"\n\nLater, Arthur was finally ready to leave. He made an effort to double-check his list. He needed to determine if every basic ingredient was available and in his cart, so his cooking operation wouldn't be missing a vital clue. He didn't want his dinner plans to disappear or fail. Maybe he would publish the recipe online if it turned out well.\n\nThe cashier scanned his groceries. The lines of shoppers seemed to flow smoothly now. Arthur was careful not to lie about the number of bags he needed. He paid in advance for a few extra bags to receive his goods safely. The store would deliver large orders, but Arthur preferred to carry his own. He grabbed his bags and walked out the door, moving to the opposite side of the parking lot.\n\nThough the incident had caused a brief pain in his schedule, making him hurry slightly, he felt a deep sense of satisfaction. It had been quite a century since he felt this useful. He didn't just earn groceries; he earned peace of mind. He was able to achieve his shopping trip and still regard humanity with hope.\n\nAs he was glad to finally enter his car and drove away, he began to reflect on the day. He would certainly appreciate the dinner tonight, and he would always remember that even an empty heart could be filled with a little kindness. He smiled as a lone star began to appear in the sky. He had managed to include all various items he needed from the home base of the supermarket. It was, indeed, an unforgettable level of supermarket shopping, ending in a perfect conclusion. He would inform his guests tonight, perhaps right before they left for a local concert. However, for now, he was just happy to be heading home.\n", "Arthur, a rich and independent professor, was known as a tough critic with a complex personality. His belief in the importance of honesty and knowledge was widely known. He loved to master a new idiom or write a proper poem. He would rather prefer a cool, quiet environment over any boring public event in society. However, to maintain his friendship with the president of the local jazz band, he decided to share his time and be a passenger on a tour along the wide coast.\n\nThe journey was meant to be a fun trip. They would ride ahead through a specific section of the desert and watch the band perform on a large stage. But the weather did not cooperate. A sudden storm began to mix with the winds, causing what felt like a minor earthquake. A heavy pole from an abandoned factory fell. It managed to strike Arthur\u2019s arm with incredible strength. The amount of pressure made him feel quite dizzy, like a false reality. To ensure his safety, they had to cancel the schedule and rush him down the long driveway of the nearest hospital center.\n\nInside, the hospital's audience of waiting patients looked tired. The staff tried to organize everyone, dealing with garbage and trash left by a common crowd. Arthur found himself situated in a regular passage before they moved him into a room to examine him. \"We need to scan your arm,\" said his guide, Dr. Lin. She was a brilliant associate who didn't lack attention to detail. \"We will remove any dirt, give you some medicine, and see if we can deal with this task.\"\n\n\"Will I need to exercise or swim for physical therapy?\" Arthur asked, trying somehow to hide his fear.\n\n\"Neither,\" Dr. Lin replied. \"Otherwise, I would suggest a different tradition of care. But you will barely need to do anything. Your memory of this will fade. I predict a fast recovery. It is highly probable you will be fine.\" She used a medical instrument that made a soft sound to demonstrate the surface of the bone above his wrist. She wanted to prove there was no major block.\n\nArthur felt a drop in his anxiety. The hospital was a busy place, but the care had great value. Dr. Lin didn't imply it would cost a fortune; the final cost was covered. The evidence of her skill was effective. Actually, I prefer this over the magic of any alternative, he thought. He began to imagine eating a nice breakfast soon, since hunger was starting to attract his thoughts.\n\n\"We will assign a nurse to you,\" the doctor said. \"In this instance, we will involve a few tests during this period. It's a standard procedure to produce the best result. You'll need to support the arm, keep it fit, and maintain hygiene. I also strongly offer this advice: avoid getting a dog bite, as infection is our main concern.\"\n\n\"Can I vote on what I eat?\" Arthur asked.\n\n\"We have a list of options,\" she said with a smile. \"It isn't a competition, you can choose your own meal.\"\n\nArthur happened to notice a spider web in the corner of the room. It reminded him of a puzzle. Life was like that.\n\nTo unite the community, the hospital began to advertise a new wellness program. As Arthur waited, he decided to gain some further insight. He asked the nurse to shoot him a message if there was any sign of a problem within his tests. But there was none. A little tip: if you want to make steady progress, you must react with respect for the medical staff.\n\nAs he got ready to leave, Arthur felt a new feature of gratitude. He didn't mean to be difficult before. He began to recognize that a hospital isn't just a place that manages a range of diseases to populate their beds. The gift of health was the true prize. A small cheer went up from his friends who came to climb the stairs to see him. Even though the trip had a rough start, his term at the hospital was a success.\n"];

        function prepareStory(baseText, wordList) {
            if(!baseText) return { html: '', matchedCount: 0 };
            let processedHtml = baseText;
            let wordsDesc = [...wordList].sort((a,b) => b.length - a.length);
            
            wordsDesc.forEach(w => {
                let regex = new RegExp(`\\b(${w})\\b(?![^<]*>)`, 'gi');
                let info = allVocab[w] || { meaning: '', audio: '' };
                processedHtml = processedHtml.replace(regex, (match) => {
                    return `<span class="vocab-word" data-word="${w.replace(/"/g, '&quot;')}" data-meaning="${info.meaning.replace(/"/g, '&quot;')}" data-audio="${info.audio}">${match}</span>`;
                });
            });

            processedHtml = processedHtml.split('\n').map(p => {
                if(p.trim().toLowerCase().startsWith('title:') || p.trim().toLowerCase().startsWith('theme:')) return `<h2>${p}</h2>`;
                return p.trim() ? `<p>${p}</p>` : '';
            }).join('');

            return { html: processedHtml, matchedCount: wordList.length };
        }

        for(let i=1; i<=4; i++) {
            const s = prepareStory(baseStories[i-1], words[i-1]);
            document.getElementById('content'+i).innerHTML = s.html;
            document.getElementById('stats'+i).innerHTML = `Đã tích hợp <strong>100%</strong> (${words[i-1].length} từ vựng) vào cốt truyện.`;
            
            let html = '';
            words[i-1].forEach(w => {
                html += `<div class="check-item check-used">✓ <strong>${w}</strong></div>`;
            });
            document.getElementById('checklist'+i).innerHTML = html;
        }

        const audioPlayer = document.getElementById('audio-player');

        document.addEventListener('click', function(e) {
            const md = document.getElementById('meaning-display');
            if(e.target && e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const meaning = e.target.getAttribute('data-meaning');
                const audioFile = e.target.getAttribute('data-audio');
                
                document.getElementById('m-word').textContent = word;
                document.getElementById('m-def').innerHTML = meaning;
                md.style.display = 'block';
                
                if (audioFile) {
                    audioPlayer.src = 'media/' + audioFile;
                    audioPlayer.play().catch(e => console.log('Audio play failed:', e));
                }
            } else if (!md.contains(e.target)) {
                md.style.display = 'none';
            }
        });

        window.showStory = function(num) {
            document.querySelectorAll('.story-container').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('button').forEach(e => e.classList.remove('active'));
            document.getElementById('area-story' + num).classList.add('active');
            document.getElementById('btn-story' + num).classList.add('active');
        };
    </script>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
            document.getElementById('theme-toggle').innerText = isDark ? '☀️' : '🌙';
        }

        // Auto-load saved theme
        (function() {
            if(localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                var btn = document.getElementById('theme-toggle');
                if(btn) btn.innerText = '☀️';
            }
        })();

    </script>

    <script>
        // ===== TRANSLATE SELECTED TEXT =====
        (function() {
            var popup = document.createElement('div');
            popup.className = 'translate-popup';
            popup.innerHTML = '🌐 Dịch';
            popup.id = 'translate-popup';
            document.body.appendChild(popup);

            var selectedText = '';

            document.addEventListener('mouseup', handleSelection);
            document.addEventListener('touchend', function() {
                setTimeout(handleSelection, 300);
            });

            function handleSelection(e) {
                var sel = window.getSelection();
                var text = sel.toString().trim();
                
                if (text.length > 2 && text.length < 1000) {
                    selectedText = text;
                    
                    var range = sel.getRangeAt(0);
                    var rect = range.getBoundingClientRect();
                    
                    popup.style.left = (rect.left + rect.width / 2 - 40 + window.scrollX) + 'px';
                    popup.style.top = (rect.top - 45 + window.scrollY) + 'px';
                    popup.style.display = 'block';
                } else {
                    popup.style.display = 'none';
                }
            }

            popup.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (selectedText) {
                    var url = 'https://translate.google.com/?sl=en&tl=vi&text=' + encodeURIComponent(selectedText);
                    window.open(url, '_blank');
                }
                popup.style.display = 'none';
            });

            document.addEventListener('mousedown', function(e) {
                if (e.target !== popup) {
                    popup.style.display = 'none';
                }
            });
        })();

    </script>

    <script>
        
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('vocab-word')) {
                const word = e.target.getAttribute('data-word');
                const data = allVocab[word.toLowerCase()];
                
                if (data) {
                    const display = document.getElementById('meaning-display');
                    
                    const checks = document.querySelectorAll('.check-item');
                    checks.forEach(c => {
                        if (c.textContent.trim().toLowerCase() === word.toLowerCase()) {
                            c.classList.add('check-used');
                        }
                    });

                    let defsHtml = '';
                    if (data.definitions && data.definitions.length > 0) {
                        data.definitions.forEach((def, index) => {
                            let posText = def.pos ? def.pos : 'Từ loại đang cập nhật';
                            let contextHtml = def.context ? `<div class="m-context">💡 <strong>Cách dùng ${index+1}:</strong> ${def.context}</div>` : '';
                            let exampleHtml = def.example ? `<div class="m-example">📖 <strong>Ví dụ:</strong> "${def.example}"</div>` : '';
                            
                            defsHtml += `
                                <div style="margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 8px;">
                                    <span class="m-type" style="margin-bottom:5px; display:inline-block;">${posText}</span>
                                    ${contextHtml}
                                    ${exampleHtml}
                                </div>
                            `;
                        });
                    } else {
                        defsHtml = `<div class="m-loading" style="margin-top: 10px;">(Dữ liệu đa nghĩa đang chờ cập nhật...)</div>`;
                    }

                    display.innerHTML = `
                        <div class="m-header">
                            <span class="m-word-title">${word}</span>
                        </div>
                        <div class="m-meaning">Nghĩa: ${data.meaning}</div>
                        ${defsHtml}
                    `;
                    display.style.display = 'flex';
                    
                    const audio = document.getElementById('audio-player');
                    if (data.audio) {
                        audio.src = 'media/' + data.audio;
                        audio.play().catch(e => console.log('Audio error:', e));
                    }

                    if (window.meaningTimeout) clearTimeout(window.meaningTimeout);
                    window.meaningTimeout = setTimeout(() => {
                        display.style.display = 'none';
                    }, 12000);
                }
            }
        });

        // Click outside to hide
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.vocab-word') && !e.target.closest('#meaning-display')) {
                const display = document.getElementById('meaning-display');
                if (display) display.style.display = 'none';
            }
        });
</script>
